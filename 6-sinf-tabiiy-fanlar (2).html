{\n  const p=.5*(wash?.6:1)*(mask?.6:1),nw=[];\n  E.forEach(x=>{if(x.s==1)for(let j=0;j\u003c4;j++){const t=R(100);if(E[t].s==0&&Math.random()\u003cp)nw.push(t)}});\n  E.forEach(x=>{if(x.s==1){x.d++;if(x.d>=4)x.s=2}});\n  nw.forEach(t=>{E[t]={s:1,d:0}});\n  eDay++;eh.push(cnt(1));eDraw();\n  if(cnt(1)==0||eDay>=30){\n    clearInterval(eTm);const tot=cnt(1)+cnt(2);\n    $('#eo').textContent=`Jami ${tot}% bola kasallandi. `+(tot\u003c=15?'Himoya choralari kasallikni to\\'xtatdi! Emlanganlar boshqalarni ham himoya qiladi.':tot\u003c=50?'Kasallik qisman to\\'xtadi. Choralarni birga qo\\'llab ko\\'ring.':'Kasallik keng tarqaldi. Emlash, qo\\'l yuvish va niqobni birga sinab ko\\'ring.');\n    if(tot\u003c=20){score+=15;upd();beep(true)}}}\n$('#ev').oninput=e=>{$('#evv').textContent=e.target.value;eSetup()};\n$('#ew').onclick=e=>{wash=!wash;e.target.textContent='🧼 Qo\\'l yuvish: '+(wash?'yoqiq':'o\\'chiq');e.target.setAttribute('aria-pressed',wash)};\n$('#em').onclick=e=>{mask=!mask;e.target.textContent='😷 Niqob: '+(mask?'yoqiq':'o\\'chiq');e.target.setAttribute('aria-pressed',mask)};\n$('#er').onclick=()=>{eSetup();eTm=setInterval(eStep,500)};\neSetup();\n\n// ---- Yakuniy test ----\nquiz($('#g5'),mk([\n ['Immunitet nima?',['Organizmning kasallikka qarshi kurashish qobiliyati','Dori turi','Mikrob turi','Ovqat turi'],0,'Immunitet organizmni himoya qiladi.'],\n ['Kuniga qancha uxlash kerak (6-sinf)?',['9–10 soat','4 soat','6 soat','14 soat'],0,'Uyqu organizmni tiklaydi.'],\n ['Qaysi biri yuqumli kasallik qo\\'zg\\'atuvchisi?',['Bakteriya','Vitamin','Suv','Tuz'],0,'Bakteriya, virus, zamburug\\' va parazitlar.'],\n ['Qaysi kasallik yuqumsiz?',['Ko\\'p shirinlikdan kelib chiqqan semizlik','Gripp','Ichak infeksiyasi','Qizilcha'],0,'Yuqumsiz kasalliklar boshqalarga yuqmaydi.'],\n ['Havo-tomchi yo\\'liga qaysi biri misol?',['Aksirish va yo\\'tal','Iflos suv','Hasharot','Yaralangan joy'],0,'Mikroblar havo bilan tarqaladi.'],\n ['Kasallik zanjiri nechta bo\\'g\\'indan iborat?',['3','1','5','7'],0,'Manba, yo\\'l, sog\\'lom odam.'],\n ['Leykotsitlarning vazifasi?',['Mikroblardan himoya','Kislorod tashish','Qon ivishi','Suv saqlash'],0,'Ular mikrobni yutadi.'],\n ['Qo\\'lni kamida necha soniya yuvish kerak?',['20','2','5','60 daqiqa'],0,'Sovun bilan 20 soniya.'],\n ['Emlash nima uchun kerak?',['Immunitet kasallikni oldindan o\\'rganadi','Mikrob ko\\'paysin deb','Ovqat o\\'rniga','Uyqu uchun'],0,'Organizm tayyor bo\\'ladi.'],\n ['Kasallik nima?',['Organizm faoliyatining buzilishi','Ovqat turi','Sport turi','Dam olish'],0,'Kasallikda organizm normal ishlay olmaydi.'],\n ['Kasal bo\\'lganda nima qilish kerak?',['Kattalarga aytib, shifokorga murojaat qilish','Dorini o\\'zi tanlash','Maktabga borish','Hech kimga aytmaslik'],0,'Davolashni shifokor belgilaydi.'],\n ['Qaysi biri kasallik belgisi?',['Isitma va holsizlik','Quvnoq kayfiyat','Yaxshi ishtaha','Kuchli yugurish'],0,'Belgilar paydo bo\\'lsa, kattalarga ayt.']]),\n ok=>'\u003cbr>'+(ok>=11?'⭐⭐⭐ Ajoyib!':ok>=8?'⭐⭐ Yaxshi!':ok>=5?'⭐ Yomon emas.':'Yana urinib ko\\'r.')+'\u003cbr>\u003csmall>Eslab qol: kasallik zanjiri 3 bo\\'g\\'indan iborat, bitta bo\\'g\\'in uzilsa kasallik tarqalmaydi. Qo\\'l yuvish, emlash va sog\\'lom turmush tarzi eng yaxshi himoya.\u003c/small>');\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "himoya", "e": "🛡️", "t": "Organizm himoyasi", "d": "Organizm tuzilishi, himoya qatlamlari, reflekslar", "h": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Organizm himoyasi | 6-sinf\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#f3f7ee;--cd:#fff;--tx:#23301f;--ac:#3a7d44;--rd:#d62839;--ln:#d5e2cf;--ok:#2b9348;--no:#d62839;--bl:#3b5bdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#141d12;--cd:#1f2c1c;--tx:#e8f2e4;--ac:#7ccf84;--ln:#324a2e}}\n:root[data-theme=\"dark\"]{--bg:#141d12;--cd:#1f2c1c;--tx:#e8f2e4;--ac:#7ccf84;--ln:#324a2e}\n*{box-sizing:border-box}html,body{margin:0}\nbody{background:var(--bg);color:var(--tx);font:600 17px/1.45 Nunito,system-ui,sans-serif;padding-bottom:84px}\nheader{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:2px solid var(--ln)}\nh1{font-size:19px;margin:0;font-weight:800}\n#sb{background:var(--ac);color:var(--bg);padding:4px 12px;border-radius:20px;font-weight:800}\nmain{max-width:640px;margin:0 auto;padding:12px 14px}\nsection{display:none}section.on{display:block}\nh2{font-size:21px;margin:8px 0;font-weight:800}h3{font-size:17px;margin:14px 0 6px;font-weight:800}\n.c,.box{background:var(--cd);border:2px solid var(--ln);border-radius:14px;padding:10px 12px;margin:8px 0}\n.c b{color:var(--ac)}\nbutton{font:inherit;font-weight:800;min-height:48px;padding:8px 14px;margin:4px 4px 4px 0;border-radius:12px;border:2px solid var(--ac);background:var(--cd);color:var(--tx);cursor:pointer}\nbutton:disabled{opacity:.6}button:focus-visible,input:focus-visible{outline:3px solid var(--bl);outline-offset:2px}\nbutton.ok{background:var(--ok);border-color:var(--ok);color:#fff}button.no{background:var(--no);border-color:var(--no);color:#fff}\n.q{font-size:20px;font-weight:800}.msg{margin:8px 0;font-weight:800}\nlabel{display:block;margin:8px 0 2px}input[type=range]{width:100%;height:32px;accent-color:var(--ac)}\n.bar{height:16px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .4s,background .4s}\n.av{font-size:64px;text-align:center;line-height:1.1}.pop{animation:pop .5s}\n@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1)}}\n@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}\n.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:30px;text-align:center}\n.grid span.in{animation:fl 1s infinite;background:#d6283933;border-radius:10px}\n.germs{font-size:20px;word-break:break-all;min-height:30px}\nsvg{width:100%;height:auto;display:block}\nnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:2px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}\nnav button{flex:1;margin:0;border:0;border-radius:0;min-height:60px;font-size:13px;background:none}\nnav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}nav span{display:block;font-size:22px}\n.note{font-size:14px;opacity:.85;margin:10px 0}\n.grid2{display:grid;grid-template-columns:repeat(10,1fr);font-size:20px;text-align:center;line-height:1.35;margin:8px 0}\n.grid2 span.k{animation:fl 1s infinite}\n#sb{display:inline-block}#snd{min-height:40px;min-width:48px;padding:4px 8px;margin:0 8px 0 0}\n.sy{opacity:.18;transition:opacity .3s}.sy.on{opacity:1}\n.on .lg{animation:lg 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}\n.on .bt{animation:bt .9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}\n@keyframes lg{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes bt{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}\n.stage{position:relative;height:90px;font-size:44px;overflow:hidden}.stage span{position:absolute;top:18px;transition:left .8s,transform .8s,opacity .8s}\n.flow span{display:inline-block;padding:4px 8px;border-radius:10px;border:2px solid var(--ln);margin:3px;font-size:15px}.flow span.hl{background:var(--ac);color:var(--bg);border-color:var(--ac)}\nbutton[aria-pressed=true].tg{background:var(--ac);color:var(--bg)}\n@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003ch1>🛡️ Organizm himoyasi\u003c/h1>\u003cdiv>\u003cbutton id=\"snd\" aria-pressed=\"true\" aria-label=\"Ovozni o'chirish\">🔊\u003c/button>\u003cspan id=\"sb\">⭐ \u003cspan id=\"sc\">0\u003c/span>\u003c/span>\u003c/div>\u003c/header>\n\u003cmain>\n\u003csection id=\"s0\" class=\"on\">\n\u003ch2>1. Odam organizmi\u003c/h2>\n\u003cdiv class=\"c\">\u003cb>Tuzilish bosqichlari:\u003c/b> hujayra → to'qima → a'zo → a'zolar sistemasi → organizm.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Asosiy sistemalar:\u003c/b> tayanch-harakat, nafas, qon aylanish, hazm, siydik ajratish, asab, ichki sekretsiya, himoya (immun).\u003c/div>\n\u003cdiv class=\"c\">Organizm \u003cb>yaxlit\u003c/b>: sistemalar bir-biri bilan bog'langan. U tashqi muhit bilan doimiy aloqada: nafas oladi, oziq oladi, ortiqchasini chiqaradi.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Ichki muhit doimiyligi:\u003c/b> tana harorati taxminan 36,6 °C atrofida saqlanadi.\u003c/div>\n\u003ch3>Tana sistemalari (sxema)\u003c/h3>\n\u003cdiv class=\"box\">\n\u003csvg viewBox=\"0 0 200 250\" role=\"img\" aria-label=\"Odam tanasi sxemasi\" style=\"max-width:260px;margin:auto\">\n\u003cg fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" opacity=\".35\">\u003ccircle cx=\"100\" cy=\"32\" r=\"24\"/>\u003crect x=\"62\" y=\"60\" width=\"76\" height=\"110\" rx=\"30\"/>\u003cpath d=\"M62 75 L30 150 M138 75 L170 150 M82 168 L74 240 M118 168 L126 240\"/>\u003c/g>\n\u003cg id=\"y-suyak\" class=\"sy\">\u003cpath d=\"M100 55 V170 M80 80 Q100 70 120 80 M78 95 Q100 85 122 95 M78 110 Q100 100 122 110 M62 75 L30 150 M138 75 L170 150 M82 168 L74 240 M118 168 L126 240\" stroke=\"#cfd8dc\" stroke-width=\"5\" stroke-linecap=\"round\" fill=\"none\"/>\u003c/g>\n\u003cg id=\"y-asab\" class=\"sy\">\u003cellipse cx=\"100\" cy=\"30\" rx=\"15\" ry=\"11\" fill=\"#f08a9b\"/>\u003cpath d=\"M100 42 V165 M100 80 L70 100 M100 80 L130 100 M100 120 L72 140 M100 120 L128 140\" stroke=\"#e9c46a\" stroke-width=\"3\" fill=\"none\"/>\u003c/g>\n\u003cg id=\"y-hazm\" class=\"sy\">\u003cellipse cx=\"112\" cy=\"140\" rx=\"14\" ry=\"9\" fill=\"#f4a261\"/>\u003cpath d=\"M85 155 q8 -8 16 0 t16 0 t16 0 M85 165 q8 -8 16 0 t16 0 t16 0\" stroke=\"#c97b3d\" stroke-width=\"5\" fill=\"none\"/>\u003c/g>\n\u003cg id=\"y-nafas\" class=\"sy\">\u003cellipse class=\"lg\" cx=\"84\" cy=\"105\" rx=\"16\" ry=\"26\" fill=\"#f4a3b0\"/>\u003cellipse class=\"lg\" cx=\"116\" cy=\"105\" rx=\"16\" ry=\"26\" fill=\"#f4a3b0\"/>\u003c/g>\n\u003cg id=\"y-qon\" class=\"sy\">\u003cpath d=\"M100 118 L62 80 M100 118 L138 80 M100 125 L80 200 M100 125 L120 200\" stroke=\"#d62839\" stroke-width=\"3\" fill=\"none\"/>\u003ctext class=\"bt\" x=\"100\" y=\"132\" font-size=\"26\" text-anchor=\"middle\">🫀\u003c/text>\u003c/g>\n\u003c/svg>\n\u003cdiv id=\"sysb\">\u003c/div>\u003cdiv class=\"msg\" id=\"sysm\">\u003c/div>\n\u003c/div>\n\u003ch3>Hujayradan organizmgacha\u003c/h3>\n\u003cdiv class=\"box\">\u003cdiv class=\"av\" id=\"lv\">🔬\u003c/div>\u003cdiv class=\"bar\">\u003ci id=\"lvb\">\u003c/i>\u003c/div>\u003cdiv class=\"msg\" id=\"lvm\">\u003c/div>\u003cbutton id=\"lvn\">Keyingi daraja ➜\u003c/button>\u003c/div>\n\u003ch3>O'yin: a'zo qaysi sistemada?\u003c/h3>\u003cdiv class=\"box\" id=\"g1\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s1\">\n\u003ch2>2. Organizm himoyasi\u003c/h2>\n\u003cdiv class=\"c\">\u003cb>1-qatlam, tashqi to'siqlar:\u003c/b> teri, shilliq qavat, kipriklar (changni chiqaradi), so'lak va ko'z yoshidagi lizotsim (mikrobni eritadi), oshqozon shirasidagi xlorid kislota.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>2-qatlam, ichki himoya:\u003c/b> leykotsitlar mikrobni yutadi (fagotsitoz), yallig'lanish (qizarish, shish), harorat ko'tarilishi mikrob ko'payishini sekinlashtiradi.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>3-qatlam, immunitet:\u003c/b> limfa tugunlari va antitanalar. Immunitet tug'ma yoki orttirilgan bo'ladi. Emlash uni oldindan tayyorlaydi.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Trombotsitlar\u003c/b> qon ivishini ta'minlab, yarani yopadi.\u003c/div>\n\u003ch3>Mikrob hujumi (sxema)\u003c/h3>\n\u003cdiv class=\"box\">\n\u003cbutton class=\"tg\" data-l=\"0\" aria-pressed=\"true\">🧱 Tashqi to'siq: yoqiq\u003c/button>\u003cbutton class=\"tg\" data-l=\"1\" aria-pressed=\"true\">⚪ Leykotsitlar: yoqiq\u003c/button>\u003cbutton class=\"tg\" data-l=\"2\" aria-pressed=\"true\">🧬 Antitanalar: yoqiq\u003c/button>\n\u003cbutton id=\"at\">🦠 Hujum (20 mikrob)\u003c/button>\n\u003cdiv class=\"msg\" id=\"atm\">\u003c/div>\u003cdiv class=\"germs\" id=\"atg\">\u003c/div>\n\u003cdiv class=\"bar\">\u003ci id=\"rk\">\u003c/i>\u003c/div>\u003cdiv class=\"msg\">Kasallik xavfi: \u003cb id=\"rkv\">0\u003c/b>%\u003c/div>\u003cdiv class=\"av\" id=\"av3\">🙂\u003c/div>\n\u003c/div>\n\u003ch3>Fagotsitoz\u003c/h3>\n\u003cdiv class=\"box\">\u003cdiv class=\"stage\">\u003cspan id=\"lk\">⚪\u003c/span>\u003cspan id=\"mb\">🦠\u003c/span>\u003c/div>\u003cdiv class=\"msg\" id=\"fgm\">Boshlash tugmasini bosing.\u003c/div>\u003cbutton id=\"fgs\">▶ Boshlash\u003c/button>\u003cbutton id=\"fsp\" aria-pressed=\"false\">🐢 Sekin: o'chiq\u003c/button>\u003c/div>\n\u003ch3>Yara bitishi\u003c/h3>\n\u003cdiv class=\"box\">\u003cdiv class=\"av\" id=\"yv\">☝️\u003c/div>\u003cdiv class=\"bar\">\u003ci id=\"yb\">\u003c/i>\u003c/div>\u003cdiv class=\"msg\" id=\"ym\">Barmoq kesildi (sxema).\u003c/div>\u003cbutton id=\"yn\">Keyingi bosqich ➜\u003c/button>\u003c/div>\n\u003ch3>Emlash (sxema)\u003c/h3>\n\u003cdiv class=\"box\">\n\u003cbutton id=\"v1\">💉 Emlangan bola\u003c/button>\u003cbutton id=\"v2\">🧒 Emlanmagan bola\u003c/button>\n\u003cdiv class=\"av\" id=\"av2\">🧒\u003c/div>\u003cdiv class=\"msg\" id=\"vm\">Birini tanlang, so'ng mikrob hujumini ko'ring.\u003c/div>\n\u003c/div>\n\u003ch3>Immun xotirasi simulyatori (sxema)\u003c/h3>\n\u003cdiv class=\"box\">\u003cdiv class=\"c\">Mikrob miqdori 11 kun davomida. Antitana birinchi uchrashuvda kech, emlangan (immun xotirali) organizmda tez chiqadi.\u003c/div>\n\u003cbutton id=\"ms1\">🦠 Birinchi uchrashuv\u003c/button>\u003cbutton id=\"ms2\">💉 Emlangan organizm\u003c/button>\n\u003csvg viewBox=\"0 0 300 100\" aria-label=\"Mikrob miqdori grafigi\">\u003crect width=\"300\" height=\"100\" fill=\"none\" stroke=\"currentColor\" opacity=\".25\"/>\u003cpolyline id=\"mc1\" fill=\"none\" stroke=\"#d62839\" stroke-width=\"3\" points=\"\"/>\u003cpolyline id=\"mc2\" fill=\"none\" stroke=\"#2b9348\" stroke-width=\"3\" points=\"\"/>\u003c/svg>\n\u003cdiv class=\"msg\">🔴 birinchi uchrashuv &nbsp; 🟢 emlangan\u003c/div>\u003cdiv class=\"msg\" id=\"mm\">\u003c/div>\u003c/div>\n\u003ch3>O'yin: himoya qatlamini top\u003c/h3>\u003cdiv class=\"box\" id=\"g2\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s2\">\n\u003ch2>3. Organizm o'zini himoya qiladi\u003c/h2>\n\u003cdiv class=\"c\">\u003cb>Reflekslar:\u003c/b> yo'talish, aksirish, ko'z yumish, qo'lni qaynoq narsadan tortish. Refleks yoyi: retseptor → sezuvchi nerv → orqa miya → harakat nervi → mushak. Refleks tez bajariladi.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Harorat boshqaruvi:\u003c/b> issiqda terlash, sovuqda titroq va tomirlarning torayishi.\u003c/div>\n\u003cdiv class=\"c\">Og'riq xavf haqida ogohlantiradi; ochlik, chanqash va charchash ehtiyojni bildiradi. Organizm o'zini tiklaydi (yara bitishi, uyqu).\u003c/div>\n\u003cdiv class=\"c\">Inson ham salomatligini asrashi kerak: gigiyena, sog'lom ovqat, 9–10 soat uyqu, harakat, emlash, zararli odatlardan saqlanish.\u003c/div>\n\u003ch3>Refleks yoyi (sxema)\u003c/h3>\n\u003cdiv class=\"box\">\u003cbutton id=\"rf\">🔥 Qo'l choynakka tegdi\u003c/button>\u003cbutton id=\"rv\">🧠 Ixtiyoriy harakat\u003c/button>\n\u003cdiv class=\"flow\" id=\"fl\">\u003c/div>\u003cdiv class=\"bar\">\u003ci id=\"flb\">\u003c/i>\u003c/div>\u003cdiv class=\"msg\" id=\"flm\">Yo'l uzunligi chizig'ida refleks qisqa.\u003c/div>\u003c/div>\n\u003ch3>Termostat\u003c/h3>\n\u003cdiv class=\"box\">\u003clabel>🌡️ Tashqi harorat: \u003cb id=\"tpv\">20\u003c/b> °C\u003cinput id=\"tp\" type=\"range\" min=\"-10\" max=\"40\" value=\"20\">\u003c/label>\n\u003cbutton id=\"kz\" aria-pressed=\"false\">👕 Yengil kiyim\u003c/button>\n\u003cdiv class=\"av\" id=\"tav\">🙂\u003c/div>\u003cdiv class=\"msg\">Tana harorati: \u003cb id=\"tb\">36,6\u003c/b> °C\u003c/div>\u003cdiv class=\"msg\" id=\"tm2\">\u003c/div>\u003c/div>\n\u003ch3>Salomatlik panjarasi\u003c/h3>\n\u003cdiv class=\"box\">\n\u003cdiv class=\"av\" id=\"av0\">🙂\u003c/div>\n\u003cdiv class=\"bar\">\u003ci id=\"imb\">\u003c/i>\u003c/div>\n\u003cdiv class=\"msg\">Himoya kuchi: \u003cspan id=\"imv\">50\u003c/span>%\u003c/div>\n\u003cdiv id=\"hb\">\u003c/div>\n\u003cdiv class=\"msg\" id=\"hm\">Odatni tanlang.\u003c/div>\n\u003c/div>\n\u003ch3>O'yin: refleksmi yoki ixtiyoriy?\u003c/h3>\u003cdiv class=\"box\" id=\"g3\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s3\">\u003ch2>Yakuniy test\u003c/h2>\u003cdiv class=\"box\" id=\"g5\">\u003c/div>\u003c/section>\n\u003cp class=\"note\">⚕️ Kasal bo'lsang, kattalarga ayt va shifokorga murojaat qil. Sxemalar soddalashtirilgan. Savol matnini variantga sudrab ham javob berish mumkin.\u003c/p>\n\u003c/main>\n\u003cnav>\n\u003cbutton class=\"on\" data-t=\"0\">\u003cspan>🧍\u003c/span>Organizm\u003c/button>\n\u003cbutton data-t=\"1\">\u003cspan>🛡️\u003c/span>Himoya\u003c/button>\n\u003cbutton data-t=\"2\">\u003cspan>⚡\u003c/span>O'zini himoya\u003c/button>\n\u003cbutton data-t=\"3\">\u003cspan>📝\u003c/span>Test\u003c/button>\n\u003c/nav>\n\u003cscript>\nlet score=0;const $=s=>document.querySelector(s),R=n=>Math.floor(Math.random()*n),upd=()=>{$('#sc').textContent=score};\ndocument.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));\n  document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('on',i==b.dataset.t));scrollTo(0,0)});\n// Ovoz (Web Audio): to'g'ri javobda baland, noto'g'rida past signal\nlet sOn=true,AC;\nconst beep=ok=>{if(!sOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=ok?660:200;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.15)}catch(e){}};\n$('#snd').onclick=e=>{sOn=!sOn;e.target.textContent=sOn?'🔊':'🔇';e.target.setAttribute('aria-pressed',sOn)};\nconst pop=el=>{el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')};\n\n// Universal savol-javob (variantlar aralashtiriladi, f=true bo'lsa tartib saqlanadi)\nconst W=[0,0,0];\nfunction quiz(box,items,done){\n  let i=0,ok=0;\n  const go=()=>{\n    if(i>=items.length){\n      box.innerHTML=`\u003cp class=\"q\">Natija: ${ok}/${items.length} ${done?done(ok):''}\u003c/p>\u003cbutton class=\"rs\">Qayta boshlash\u003c/button>`;\n      box.querySelector('.rs').onclick=()=>quiz(box,items,done);return}\n    const t=items[i],ord=t.o.map((_,k)=>k);if(!t.f)ord.sort(()=>Math.random()-.5);\n    box.innerHTML=`\u003cp class=\"q\">${t.q}\u003c/p>`+ord.map(k=>`\u003cbutton data-k=\"${k}\">${t.o[k]}\u003c/button>`).join('')+'\u003cdiv class=\"msg fb\">\u003c/div>';\n    // Sudrab qo'yish: savol matnini variantga olib borib qo'yish ham javob beradi\n    const q=box.querySelector('.q');q.style.touchAction='none';q.style.cursor='grab';q.style.userSelect='none';\n    q.onpointerdown=e=>{q.setPointerCapture(e.pointerId);const x0=e.clientX,y0=e.clientY;q.style.position='relative';q.style.zIndex=9;\n      q.onpointermove=m=>{q.style.transform=`translate(${m.clientX-x0}px,${m.clientY-y0}px)`};\n      q.onpointerup=u=>{q.onpointermove=q.onpointerup=null;q.style.transform='';q.style.visibility='hidden';\n        const el=document.elementFromPoint(u.clientX,u.clientY);q.style.visibility='';\n        const b=el&&el.closest('button[data-k]');if(b&&box.contains(b)&&!b.disabled)b.click()}};\n    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{\n      const k=+b.dataset.k;box.querySelectorAll('button').forEach(x=>x.disabled=true);\n      if(k==t.a){ok++;score+=10;b.classList.add('ok')}else{if(t.s!=null)W[t.s]=(W[t.s]||0)+1;b.classList.add('no');box.querySelector(`[data-k=\"${t.a}\"]`).classList.add('ok')}\n      upd();beep(k==t.a);box.querySelector('.fb').innerHTML=(k==t.a?'✅ To\\'g\\'ri! ':'❌ Noto\\'g\\'ri. ')+t.e+'\u003cbr>\u003cbutton class=\"nx\">Keyingisi\u003c/button>';\n      box.querySelector('.nx').onclick=()=>{i++;go()}});\n  };go()}\nconst mk=(arr,o,f)=>arr.map(x=>({q:x[0],o:o||x[1],a:o?x[1]:x[2],e:o?x[2]:x[3],f}));\n\n\n// ---- 1-bo'lim: tana sistemalari ----\nconst SYS=[['nafas','🫁 Nafas','O\\'pka havodan kislorod oladi, karbonat angidridni chiqaradi.'],['qon','🫀 Qon aylanish','Yurak qonni tomirlar orqali butun tanaga haydaydi.'],['hazm','🍽️ Hazm','Oshqozon va ichak ovqatni hazm qilib, oziq moddalarni qonga o\\'tkazadi.'],['asab','🧠 Asab','Miya va orqa miya organizm ishini boshqaradi.'],['suyak','🦴 Tayanch-harakat','Suyak va mushaklar tanani tutib turadi va harakatlantiradi.']];\n$('#sysb').innerHTML=SYS.map((s,i)=>`\u003cbutton data-i=\"${i}\">${s[1]}\u003c/button>`).join('');\ndocument.querySelectorAll('#sysb button').forEach(b=>b.onclick=()=>{const s=SYS[+b.dataset.i];\n  document.querySelectorAll('.sy').forEach(g=>g.classList.toggle('on',g.id=='y-'+(s[0]=='suyak'?'suyak':s[0])));$('#sysm').textContent=s[2]});\ndocument.querySelector('#sysb button').click();\nconst LV=[['🔬','1. Hujayra: tirik organizmning eng kichik qismi.'],['🧵','2. To\\'qima: o\\'xshash hujayralar guruhi.'],['🫀','3. A\\'zo: bir necha to\\'qimadan tuzilgan (masalan, yurak).'],['🧩','4. A\\'zolar sistemasi: birga ishlovchi a\\'zolar (qon aylanish).'],['🧍','5. Organizm: barcha sistemalar birgalikda.']];\nlet li=-1;$('#lvn').onclick=()=>{li=(li+1)%5;const a=$('#lv');a.textContent=LV[li][0];a.style.fontSize=(40+li*14)+'px';pop(a);$('#lvb').style.width=(li+1)*20+'%';$('#lvm').textContent=LV[li][1]};$('#lvn').click();\nconst sy4=['Nafas','Qon aylanish','Hazm','Asab','Tayanch-harakat'];\nquiz tsitlar jarohatga to\\'planadi.'],['🔴','3. Qon ivib, quyqa hosil bo\\'ladi va yarani yopadi.'],['⚪','4. Leykotsitlar kirgan mikroblarni yutadi.'],['🟢','5. Teri tiklanadi, yara bitadi.']];\nlet yi=0;$('#yn').onclick=()=>{yi=(yi+1)%YB.length;$('#yv').textContent=YB[yi][0];pop($('#yv'));$('#ym').textContent=YB[yi][1];$('#yb').style.width=yi*20+'%'};\nquiz($('#g2'),mk([['🧱 Teri',0],['💧 Ko\\'z yoshidagi lizotsim',0],['👃 Burundagi kipriklar',0],['⚪ Leykotsit',1],['🌡️ Yallig\\'lanish va qizarish',1],['🧬 Antitana',2],['🧫 Limfa tugunlari',2],['💉 Emlash',2]].map(x=>[x[0],x[1],['1-qatlam: tashqi to\\'siq.','2-qatlam: ichki himoya.','3-qatlam: immunitet.'][x[1]]]),['1-qatlam: tashqi to\\'siq','2-qatlam: ichki himoya','3-qatlam: immunitet']));\n\nconst vac=(ok)=>{const a=$('#av2');a.textContent='🦠';setTimeout(()=>{a.textContent=ok?'😀':'🤒';pop(a);\n  $('#vm').textContent=ok?'Emlangan bolada leykotsitlar mikrobni tez taniydi va yengadi.':'Emlanmagan bola kasallikka tezroq beriladi va kasallik og\\'ir kechishi mumkin. Shifokorga murojaat qil.'},900)};\n$('#v1').onclick=()=>vac(true);$('#v2').onclick=()=>vac(false);\n\n// ---- Immun xotirasi: antitana javobi qachon boshlanishiga qarab mikrob miqdori ----\nconst MP={};\nfunction mem(n){\n  const st=n==2?1:4,rt=n==2?.6:.35;let M=2,d=0,pk=2;const pts=[2],L=$('#mc'+n);\n  clearInterval(mem['t'+n]);L.setAttribute('points','5,84');\n  mem['t'+n]=setInterval(()=>{\n    d++;const A=Math.max(0,Math.min(1.2,(d-st)*rt));\n    M=Math.max(0,Math.min(11,M*(1.45-A)));pts.push(M);pk=Math.max(pk,M);\n    L.setAttribute('points',pts.map((v,i)=>`${5+i*26},${95-v*8}`).join(' '));\n    if(d>=11){clearInterval(mem['t'+n]);MP[n]=pk.toFixed(1);\n      $('#mm').textContent='Eng ko\\'p mikrob: birinchi uchrashuvda '+(MP[1]||'?')+', emlanganda '+(MP[2]||'?')+'. Immun xotira antitanani tez chiqaradi.'}\n  },350)}\n$('#ms1').onclick=()=>mem(1);$('#ms2').onclick=()=>mem(2);\n\n// ---- 3-bo'lim: o'zini himoya ----\nlet flT;\nfunction flow(p,msg){clearInterval(flT
