0\"/>\n    \u003ccircle cx=\"150\" cy=\"82\" r=\"34\" fill=\"#fff\" stroke=\"#374151\" stroke-width=\"4\"/>\n    \u003cline id=\"hh\" x1=\"150\" y1=\"82\" x2=\"150\" y2=\"62\" stroke=\"#111\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n    \u003cline id=\"mh\" x1=\"150\" y1=\"82\" x2=\"150\" y2=\"56\" stroke=\"#ef4444\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    \u003ctext id=\"dt\" x=\"150\" y=\"140\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#fff\">06:00\u003c/text>\n  \u003c/svg>\n  \u003cdiv class=\"card\">Ovqat kartasini soat chizig'idagi to'g'ri vaqtga sudra (yoki kartani, keyin vaqtni bos), so'ng kunni boshla.\u003c/div>\n  \u003cdiv class=\"row\" id=\"slots\">\u003c/div>\n  \u003cdiv class=\"grid\" id=\"mc\" style=\"margin-top:8px\">\u003c/div>\n  \u003cbutton class=\"btn big\" id=\"go\">▶ Kunni boshlash\u003c/button>\n  \u003cdiv class=\"row\">\u003cbutton class=\"btn bad\" id=\"late\">🍔 Kechasi 22:00 da og'ir ovqat\u003c/button>\u003cbutton class=\"btn alt\" id=\"snack\">🍬 Tamaddi\u003c/button>\u003c/div>\n  \u003cdiv id=\"pie\">\u003c/div>\n  \u003ch2>🫀 Oshqozon-ichak yo'li\u003c/h2>\n  \u003csvg viewBox=\"0 0 300 230\" style=\"width:100%;background:#fff;border-radius:16px\">\n    \u003cpath id=\"tract\" d=\"M150,20 L150,70 C150,105 105,105 105,130 L195,130 L105,152 L195,152 L105,174 L195,174 L215,180 L215,212 L85,212 L85,192 L60,192\" fill=\"none\" stroke=\"#fbcfe8\" stroke-width=\"20\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n    \u003ctext x=\"165\" y=\"24\" font-size=\"13\">👄 Og'iz\u003c/text>\u003ctext x=\"165\" y=\"60\" font-size=\"13\">Qizilo'ngach\u003c/text>\n    \u003ctext x=\"115\" y=\"118\" font-size=\"13\">Oshqozon\u003c/text>\u003ctext x=\"205\" y=\"148\" font-size=\"13\">Ingichka\u003c/text>\n    \u003ctext x=\"30\" y=\"226\" font-size=\"13\">Yo'g'on ichak\u003c/text>\n    \u003ccircle id=\"food\" r=\"9\" fill=\"#f59e0b\" stroke=\"#b45309\" stroke-width=\"2\"/>\n  \u003c/svg>\n  \u003cdiv class=\"card\" id=\"stg\">\u003c/div>\n  \u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"pz\">⏸ To'xtat\u003c/button>\u003clabel style=\"flex:1;min-width:150px\">Tezlik \u003cinput type=\"range\" id=\"spd\" min=\"1\" max=\"10\" value=\"4\" style=\"width:100%;height:40px\">\u003c/label>\u003c/div>\n  \u003ch2>⏱ Mini-o'yin: ovqatlanish tartibi\u003c/h2>\n  \u003cdiv class=\"card\">Ovqatlarni ertalabdan kechgacha to'g'ri ketma-ketlikda bos. 60 soniya!\u003c/div>\n  \u003cbutton class=\"btn big\" id=\"gs\">▶ O'yinni boshlash\u003c/button>\u003cdiv id=\"gt\" style=\"font-weight:700\">\u003c/div>\u003cdiv class=\"grid\" id=\"gc\">\u003c/div>`;\n  // Vaqt chizig'i\n  MEALS.forEach(m => { const s = document.createElement(\"div\"); s.className = \"slot\"; s.dataset.id = m.id; s.innerHTML = `\u003cb>${m.tl}\u003c/b>\u003cbr>?`; $(\"#slots\").append(s); });\n  shuffle(MEALS).forEach(m => { const d = document.createElement(\"div\"); d.className = \"dc\"; d.dataset.id = m.id; d.innerHTML = `\u003cdiv style=\"font-size:32px\">${m.e}\u003c/div>${m.n}`; $(\"#mc\").append(d); });\n  wire($$(\"#mc .dc\"), \"#slots .slot\", (el, z) => {\n    const m = MEALS.find(x => x.id === el.dataset.id);\n    if(z.dataset.id === el.dataset.id && !placed[m.id]){\n      placed[m.id] = 1; z.classList.add(\"ok\"); z.innerHTML = `\u003cb>${m.tl}\u003c/b>\u003cbr>${m.e} ✅`; el.remove(); add(10); good(); confetti();\n      setAv(2, \"happy\", `To'g'ri! ${m.n} soat ${m.tl} da. +10 ball`, \"jump\", \"✅\");\n      if(Object.keys(placed).length === 5) $(\"#pie\").innerHTML = pie();\n    } else { bad(); z.classList.add(\"wrong\"); setTimeout(() => z.classList.remove(\"wrong\"), 500); setAv(2, \"sad\", \"Bu vaqt to'g'ri kelmaydi. Yana urin!\", \"shake\"); }\n  });\n  $(\"#go\").onclick = startDay;\n  $(\"#late\").onclick = () => { bad(); setAv(2, \"heavy\", \"Kechasi og'ir ovqat! Uxlay olmayman, qornim og'riyapti 😣\", \"shake\", \"🤢\"); };\n  $(\"#snack\").onclick = () => { snacks++; if(snacks > 2){ bad(); setAv(2, \"heavy\", \"Juda ko'p tamaddi! Qorin og'ir, asosiy ovqatga ishtaha yo'q.\", \"shake\", \"🍬\"); } else setAv(2, \"happy\", \"Bitta yengil tamaddi zarar qilmaydi 🙂\", \"jump\"); };\n  $(\"#pz\").onclick = () => { digPause = !digPause; $(\"#pz\").textContent = digPause ? \"▶ Davom ettir\" : \"⏸ To'xtat\"; };\n  $(\"#gs\").onclick = startOrder; drawClock(6);\n  startDig(); setAv(2, \"happy\", \"Ovqatlarni vaqtiga qo'yib chiq!\");\n}\n// Soatni chizish: vaqtga qarab osmon, quyosh va oy\nfunction drawClock(t){\n  const H = Math.floor(t), M = Math.floor((t % 1) * 60);\n  $(\"#dt\").textContent = String(H).padStart(2,\"0\") + \":\" + String(M).padStart(2,\"0\");\n  const rot = (id, deg) => $(id).setAttribute(\"transform\", `rotate(${deg} 150 82)`);\n  rot(\"#hh\", (t % 12) / 12 * 360); rot(\"#mh\", (t % 1) * 360);\n  $(\"#skyr\").setAttribute(\"fill\", t \u003c 8 ? \"#fdba74\" : t \u003c 17 ? \"#7dd3fc\" : t \u003c 19.5 ? \"#fb923c\" : \"#1e1b4b\");\n  const f = (t - 6) / 13, g = Math.max(0, (t - 18.5) / 3.5);\n  $(\"#sun\").setAttribute(\"cx\", 20 + 260 * Math.min(1, f)); $(\"#sun\").setAttribute(\"cy\", 115 - 90 * Math.sin(Math.PI * Math.min(1, f)));\n  $(\"#sun\").style.opacity = t \u003c 19.5 ? 1 : 0;\n  $(\"#moon\").setAttribute(\"cx\", 40 + 220 * g); $(\"#moon\").setAttribute(\"cy\", 60 - 30 * Math.sin(Math.PI * g)); $(\"#moon\").style.opacity = t >= 18.5 ? 1 : 0;\n}\nfunction startDay(){\n  stopSims(); T = 6; const chk = {}; let missed = 0; snacks = 0;\n  setAv(2, \"happy\", \"Kun boshlandi! ☀️\");\n  clk = setInterval(() => {\n    T += .1; drawClock(Math.min(T, 22));\n    MEALS.forEach(m => {\n      if(T >= m.t + .4 && !chk[m.id]){\n        chk[m.id] = 1;\n        if(!placed[m.id]){ missed++; bad(); const r = MISS[m.id]; setAv(2, r[0], r[1], \"yawn\", m.id === \"n\" ? \"😵‍💫\" : \"⚠️\"); }\n        else { good(); setAv(2, \"happy\", `${m.n} vaqtida yeyildi. Ajoyib!`, \"jump\", m.e); }\n      }\n    });\n    if(T >= 22){ stopSims(); $(\"#pie\").innerHTML = pie();\n      if(!missed){ setAv(2, \"strong\", \"Kun a'lo o'tdi! Kuchim to'la 💪\", \"jump\", \"🏆\"); add(20, 1); confetti(); }\n      else setAv(2, \"tired\", `${missed} ta ovqat o'tkazib yuborildi. Ertaga tartibga rioya qilaman!`, \"yawn\"); }\n  }, 250);\n}\n// Ovqat ulushi doiraviy diagrammasi\nfunction pie(){\n  let a = 0; const seg = [], leg = [];\n  MEALS.filter(m => placed[m.id]).forEach(m => { seg.push(`${m.c} ${a}% ${a + m.s}%`); a += m.s; leg.push(`\u003cspan style=\"color:${m.c}\">■\u003c/span> ${m.n} ${m.s}%`); });\n  seg.push(`#e5e7eb ${a}% 100%`);\n  return `\u003cdiv class=\"card\">\u003ch3>📊 Kunlik ovqat ulushi\u003c/h3>\u003cdiv class=\"pie\" style=\"background:conic-gradient(${seg.join(\",\")})\">\u003c/div>${leg.join(\"\u003cbr>\")}\u003c/div>`;\n}\n// Hazm qilish animatsiyasi\nfunction startDig(){\n  const path = $(\"#tract\"), L = path.getTotalLength(); cancelAnimationFrame(dig);\n  const step = () => {\n    if($(\"#v-s2\").classList.contains(\"on\") && !digPause){\n      digP += $(\"#spd\").value * .0004; if(digP > 1) digP = 0;\n      const p = path.getPointAtLength(digP * L); $(\"#food\").setAttribute(\"cx\", p.x); $(\"#food\").setAttribute(\"cy\", p.y);\n      const st = [...STAGES].reverse().find(s => digP >= s.p); $(\"#stg\").textContent = st.t;\n    }\n    dig = requestAnimationFrame(step);\n  };\n  step();\n}\n// Mini-o'yin: to'g'ri ketma-ketlik\nfunction startOrder(){\n  clearInterval(gm); let next = 0, left = 60; $(\"#gt\").textContent = \"⏱ 60\"; $(\"#gc\").innerHTML = \"\";\n  shuffle(MEALS).forEach(m => {\n    const d = document.createElement(\"div\"); d.className = \"dc\"; d.innerHTML = `\u003cdiv style=\"font-size:32px\">${m.e}\u003c/div>${m.n}`;\n    d.onclick = () => {\n      if(!gm) return;\n      if(MEALS[next].id === m.id){ next++; d.style.background = \"#bbf7d0\"; d.innerHTML += ` ✅${next}`; d.onclick = null; good();\n        if(next === 5){ clearInterval(gm); gm = null; add(20 + left, 1); confetti(); $(\"#gt\").textContent = \"🎉 Ajoyib! Qolgan vaqt uchun bonus oldingiz.\"; } }\n      else { bad(); d.classList.add(\"wrong\"); setTimeout(() => d.classList.remove(\"wrong\"), 500); }\n    };\n    $(\"#gc\").append(d);\n  });\n  gm = setInterval(() => { left--; $(\"#gt\").textContent = \"⏱ \" + left; if(left \u003c= 0){ clearInterval(gm); gm = null; $(\"#gt\").textContent = \"⌛ Vaqt tugadi. Yana urinib ko'r!\"; } }, 1000);\n}\n\n/* ===================== 3-BO'LIM ===================== */\nconst plate = {}; // mahsulot indeksi -> gramm\nlet hpDone = false;\nfunction buildS3(){\n  $(\"#v-s3\").innerHTML = `\u003ch1>🍎 Kaloriyaga e'tibor\u003c/h1>${avHTML(3)}${theory(\"s3\")}\n  \u003ch2>🧮 Kaloriya hisoblagich\u003c/h2>\n  \u003cdiv class=\"card\">Mahsulotni bos yoki likopchaga sudra. Grammni slayder bilan o'zgartir (50–300 g).\u003c/div>\n  \u003cdiv class=\"grid\" id=\"fd\">\u003c/div>\n  \u003ch3>🍽 Mening likopcham\u003c/h3>\n  \u003cdiv class=\"zone\" id=\"plate\">Bu yerga tashla\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-top:8px\">\u003cb id=\"kc\">0\u003c/b> / ${TARGET} kkal \u003cspan id=\"zn\">\u003c/span>\u003cdiv class=\"bar\">\u003ci id=\"kb\" style=\"width:0\">\u003c/i>\u003c/div>\n    \u003cdiv class=\"pie\" id=\"mp\" style=\"background:#e5e7eb\">\u003c/div>\u003cdiv id=\"ml\" style=\"text-align:center\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"vt\">\u003c/div>\n  \u003clabel style=\"display:block;margin:8px 0\">\u003cinput type=\"checkbox\" id=\"hp\" style=\"width:28px;height:28px;vertical-align:middle\"> 🥗 Sog'lom likopcha rejimi\u003c/label>\n  \u003cdiv id=\"hpb\">\u003c/div>\n  \u003cbutton class=\"btn big alt\" id=\"cmp\">⚖️ Taqqosla: sog'lom va nosog'lom kun\u003c/button>`;\n  FOODS.forEach((f, i) => {\n    const d = document.createElement(\"div\"); d.className = \"dc\"; d.dataset.i = i;\n    d.innerHTML = `\u003cdiv style=\"font-size:34px\">${f.e}\u003c/div>${f.n}\u003cdiv style=\"font-size:13px;font-weight:400\">${f.k} kkal · O${f.p} Y${f.f} U${f.c}\u003c/div>`;\n    d.onclick = () => { if(!d._d) addFood(i); }; drag(d, \"#plate\", () => addFood(i)); $(\"#fd\").append(d);\n  });\n  $(\"#hp\").onchange = calc; $(\"#cmp\").onclick = compare; calc();\n}\nfunction addFood(i){ if(!plate[i]) plate[i] = 100; good(); calc(); }\nfunction calc(){\n  let k = 0, p = 0, f = 0, c = 0; const grp = {v:0, g:0, p:0, o:0};\n  $(\"#plate\").innerHTML = \"\";\n  const keys = Object.keys(plate);\n  if(!keys.length) $(\"#plate\").textContent = \"Bu yerga tashla\";\n  keys.forEach(i => {\n    const x = FOODS[i], g = plate[i]; k += x.k * g / 100; p += x.p * g / 100; f += x.f * g / 100; c += x.c * g / 100; grp[x.t] += g;\n    const r = document.createElement(\"div\"); r.className = \"item\";\n    r.innerHTML = `\u003cspan style=\"font-size:28px\">${x.e}\u003c/span>\u003cinput type=\"range\" min=\"50\" max=\"300\" step=\"10\" value=\"${g}\">\u003cb style=\"min-width:52px\">${g} g\u003c/b>\u003cbutton class=\"ib\" style=\"background:#fecaca\">✖\u003c/button>`;\n    r.querySelector(\"input\").oninput = e => { plate[i] = +e.target.value; calc(); };\n    r.querySelector(\"button\").onclick = () => { delete plate[i]; calc(); };\n    $(\"#plate\").append(r);\n  });\n  k = Math.round(k); $(\"#kc\").textContent = k; $(\"#kb\").style.width = Math.min(100, k / TARGET * 100) + \"%\";\n  // Zona va avatar\n  let z, m, t, an;\n  if(!keys.length){ z = \"\"; m = \"happy\"; t = \"Mahsulot tanla, kaloriyani hisoblaymiz!\"; }\n  else if(k \u003c 1600){ z = \"🔻 Kam\"; m = \"tired\"; t = \"Kaloriya kam — holsizlanyapman.\"; an = \"yawn\"; }\n  else if(k >= 2000 && k \u003c= 2600){ z = \"✅ Me'yorda\"; m = \"strong\"; t = \"Zo'r! Kaloriya me'yorida, kuchim to'la!\"; an = \"jump\"; }\n  else if(k > 2800){ z = \"🔺 Ko'p\"; m = \"heavy\"; t = \"Juda ko'p kaloriya, qorin og'ir...\"; an = \"shake\"; }\n  else { z = \"〰️ Deyarli\"; m = \"happy\"; t = \"Me'yorga yaqin (2000–2600 kkal).\"; }\n  $(\"#zn\").textContent = z; setAv(3, m, t, an);\n  // Oqsil/yog'/uglevod ulushi\n  const tot = p + f + c || 1, pp = Math.round(p / tot * 100), fp = Math.round(f / tot * 100), cp = 100 - pp - fp;\n  $(\"#mp\").style.background = keys.length ? `conic-gradient(#ef4444 0 ${pp}%,#facc15 ${pp}% ${pp + fp}%,#3b82f6 ${pp + fp}% 100%)` : \"#e5e7eb\";\n  $(\"#ml\").innerHTML = keys.length ? `\u003cspan style=\"color:#ef4444\">■\u003c/span> Oqsil ${pp}% \u003cspan style=\"color:#ca8a04\">■\u003c/span> Yog' ${fp}% \u003cspan style=\"color:#3b82f6\">■\u003c/span> Uglevod ${keys.length ? cp : 0}%` : \"\";\n  // Vitamin ko'rsatkichi\n  $(\"#vt\").innerHTML = keys.length ? (grp.v ? `\u003cdiv class=\"okmsg\">🍊 Vitamin ko'rsatkichi: yaxshi (meva/sabzavot bor)\u003c/div>` : `\u003cdiv class=\"warn\">⚠️ Meva yoki sabzavot yo'q — vitamin yetishmaydi!\u003c/div>`) : \"\";\n  // Sog'lom likopcha rejimi: yarmi meva/sabzavot, choragi don, choragi oqsil\n  const all = grp.v + grp.g + grp.p + grp.o;\n  if($(\"#hp\").checked){\n    const pc = x => all ? Math.round(x / all * 100) : 0, V = pc(grp.v), G = pc(grp.g), P = pc(grp.p);\n    const ok = all >= 300 && V >= 40 && V \u003c= 60 && G >= 15 && G \u003c= 35 && P >= 15 && P \u003c= 35 && !grp.o;\n    $(\"#hpb\").innerHTML = `\u003cdiv class=\"card\">\u003cdiv class=\"pie\" style=\"background:conic-gradient(#4ade80 0 50%,#fbbf24 50% 75%,#f87171 75% 100%)\">\u003c/div>\n      Ko'rsatma: 🥦 50% sabzavot/meva, 🍚 25% don, 🍗 25% oqsil.\u003cbr>Seniki: 🥦 ${V}% · 🍚 ${G}% · 🍗 ${P}%\u003c/div>` + (ok ? `\u003cdiv class=\"okmsg\">🌟 Sog'lom likopcha! Yulduzcha olding!\u003c/div>` : \"\");\n    if(ok && !hpDone){ hpDone = true; add(30, 1); confetti(); good(); }\n  } else $(\"#hpb\").innerHTML = \"\";\n}\n// Ikki xil kun menyusini taqqoslash\nfunction compare(){\n  const sum = list => { let k = 0, p = 0, f = 0, c = 0; list.forEach(([i, g]) => { const x = FOODS[i]; k += x.k * g / 100; p += x.p * g / 100; f += x.f * g / 100; c += x.c * g / 100; }); return {k:Math.round(k), p:Math.round(p), f:Math.round(f), c:Math.round(c)}; };\n  const col = (title, list, cl) => { const s = sum(list); return `\u003cdiv style=\"flex:1;min-width:140px;background:${cl};border-radius:14px;padding:10px\">\u003ch3>${title}\u003c/h3>${list.map(([i, g]) => `${FOODS[i].e} ${FOODS[i].n} ${g} g`).join(\"\u003cbr>\")}\u003cp>\u003cb>${s.k} kkal\u003c/b>\u003cbr>Oqsil ${s.p} g\u003cbr>Yog' ${s.f} g\u003cbr>Uglevod ${s.c} g\u003c/p>\u003c/div>`; };\n  modal(`\u003ch2>⚖️ Taqqoslash\u003c/h2>\u003cdiv class=\"row\">${col(\"😄 Sog'lom kun\", MENU_GOOD, \"#dcfce7\")}${col(\"🤢 Nosog'lom kun\", MENU_BAD, \"#fee2e2\")}\u003c/div>\u003cp>Nosog'lom menyuda shirinlik, chips va gazli ichimlik ko'p, sabzavot va oqsil kam. Kaloriya ko'p, foyda oz.\u003c/p>`);\n}\n\n/* ===================== YAKUNIY TEST ===================== */\nlet qi = 0, right = 0; const wrongBy = {1:0, 2:0, 3:0}; let order = [];\nfunction buildTest(){ qi = 0; right = 0; order = shuffle(QUESTIONS); [1,2,3].forEach(k => wrongBy[k] = 0); $(\"#v-t\").innerHTML = `\u003ch1>📝 Yakuniy test\u003c/h1>${avHTML(\"T\")}\u003cdiv id=\"tq\">\u003c/div>`; setAv(\"T\", \"happy\", \"Omad! 10 ta savol.\"); question(); }\nfunction question(){\n  if(qi >= order.length) return result();\n  const q = order[qi];\n  $(\"#tq\").innerHTML = `\u003cdiv class=\"card\">\u003cb>Savol ${qi + 1}/10\u003c/b>\u003cbr>${q.q}\u003c/div>\u003cdiv class=\"grid\" style=\"grid-template-columns:1fr\" id=\"op\">\u003c/div>\u003cdiv id=\"ex\">\u003c/div>`;\n  q.o.forEach((o, i) => { const b = document.createElement(\"button\"); b.className = \"btn alt\"; b.textContent = o; b.onclick = () => answer(i, b); $(\"#op\").append(b); });\n}\nfunction answer(i, b){\n  const q = order[qi]; $$(\"#op button\").forEach((x, j) => { x.disabled = true; if(j === q.a) x.style.background = \"#bbf7d0\"; });\n  if(i === q.a){ right++; add(10); good(); $(\"#ex\").innerHTML = `\u003cdiv class=\"okmsg\">✅ To'g'ri! ${q.e}\u003c/div>`; setAv(\"T\", \"strong\", \"Barakalla!\", \"jump\", \"⭐\"); }\n  else { wrongBy[q.s]++; bad(); b.style.background = \"#fecaca\"; $(\"#ex\").innerHTML = `\u003cdiv class=\"warn\">❌ To'g'ri javob: ${q.o[q.a]}. ${q.e}\u003c/div>`; setAv(\"T\", \"sad\", \"Xato qilsang ham, o'rganasan!\", \"shake\"); }\n  $(\"#ex\").innerHTML += `\u003cbutton class=\"btn big\" onclick=\"qi++;question()\">Keyingisi ➡️\u003c/button>`;\n}\nfunction result(){\n  const st = right >= 9 ? 3 : right >= 7 ? 2 : right >= 5 ? 1 : 0;\n  const weak = [1,2,3].sort((a, b) => wrongBy[b] - wrongBy[a])[0];\n  if(st) { add(0, st); confetti(); }\n  setAv(\"T\", st ? \"strong\" : \"tired\", st ? \"Ajoyib natija!\" : \"Yana urinib ko'r!\", st ? \"jump\" : \"yawn\");\n  $(\"#tq\").innerHTML = `\u003cdiv class=\"card\" style=\"text-align:center\">\u003ch2>${right} / 10\u003c/h2>\u003cdiv style=\"font-size:44px\">${st ? \"⭐\".repeat(st) : \"💪\"}\u003c/div>\u003cp>${st ? \"Barakalla!\" : \"Yana urinib ko'r\"}\u003c/p>\n    ${wrongBy[weak] ? `\u003cp>Eng kuchsiz bo'lim: \u003cb>${SECNAME[weak]}\u003c/b>\u003c/p>\u003cbutton class=\"btn big\" onclick=\"show('${SECVIEW[weak]}')\">Shu bo'limga o'tish\u003c/button>` : `\u003cp>Hamma bo'limni yaxshi bilasan! 🏆\u003c/p>`}\n    \u003cbutton class=\"btn big alt\" onclick=\"buildTest()\">🔁 Qayta topshirish\u003c/button>\u003cbutton class=\"btn big alt\" onclick=\"recap()\">💡 Eslab qol!\u003c/button>\u003c/div>`;\n}\n\n/* ===================== BOSHLASH ===================== */\nshow(\"home\");\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "nafas", "e": "🫁", "t": "Nafas va qon aylanish", "d": "Tashqi muhit, yashash muhiti, nafas va qon aylanish", "h": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Nafas va qon aylanish\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#eef7f6;--cd:#fff;--tx:#12363d;--ac:#0e8a8a;--rd:#e5484d;--bl:#3b5bdb;--ok:#2b9348;--no:#d62839;--ln:#cfe3e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0d2226;--cd:#153238;--tx:#e6f4f2;--ac:#4fd1c5;--ln:#24484f}}\n:root[data-theme=\"dark\"]{--bg:#0d2226;--cd:#153238;--tx:#e6f4f2;--ac:#4fd1c5;--ln:#24484f}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:var(--bg);color:var(--tx);font:600 17px/1.45 Nunito,system-ui,sans-serif;padding-bottom:84px}\nheader{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:2px solid var(--ln)}\nh1{font-size:19px;margin:0;font-weight:800}\n#sb{background:var(--ac);color:#fff;padding:4px 12px;border-radius:20px;font-weight:800}\nmain{max-width:640px;margin:0 auto;padding:12px 14px}\nsection{display:none}section.on{display:block}\nh2{font-size:21px;margin:8px 0;font-weight:800}\nh3{font-size:17px;margin:14px 0 6px;font-weight:800}\n.c{background:var(--cd);border:2px solid var(--ln);border-radius:14px;padding:10px 12px;margin:8px 0}\n.c b{color:var(--ac)}\n.box{background:var(--cd);border:2px solid var(--ln);border-radius:14px;padding:12px;margin:8px 0}\nsvg{width:100%;height:auto;display:block;border-radius:10px}\nlabel{display:block;margin:8px 0 2px}\ninput[type=range]{width:100%;height:32px;accent-color:var(--ac)}\nbutton{font:inherit;font-weight:800;min-height:48px;padding:8px 14px;margin:4px 4px 4px 0;border-radius:12px;border:2px solid var(--ac);background:var(--cd);color:var(--tx);cursor:pointer}\nbutton:focus-visible,input:focus-visible{outline:3px solid var(--bl);outline-offset:2px}\nbutton.ok{background:var(--ok);border-color:var(--ok);color:#fff}\nbutton.no{background:var(--no);border-color:var(--no);color:#fff}\n.q{font-size:20px;font-weight:800}\n.bar{height:16px;background:var(--ln);border-radius:9px;overflow:hidden}\n.bar i{display:block;height:100%;width:50%;transition:width .4s,background .4s}\n.msg{margin:8px 0;font-weight:800}\nnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:2px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}\nnav button{flex:1;margin:0;border:0;border-radius:0;min-height:60px;font-size:13px;background:none}\nnav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}\nnav span{display:block;font-size:22px}\n.lung{transform-box:fill-box;transform-origin:center;animation:br var(--bt,3.2s) ease-in-out infinite}\n.dia{animation:dp var(--bt,3.2s) ease-in-out infinite}\n@keyframes br{0%,100%{transform:scale(.82)}50%{transform:scale(1.08)}}\n@keyframes dp{0%,100%{transform:translateY(-4px)}50%{transform:translateY(6px)}}\n.smoky .lung{fill:#8a8f98}\n@media(prefers-reduced-motion:reduce){.lung,.dia{animation-duration:8s}}\n.st{font-size:32px;text-align:center;margin:8px 0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003ch1>🫁 Nafas va qon aylanish\u003c/h1>\u003cdiv id=\"sb\">⭐ \u003cspan id=\"sc\">0\u003c/span>\u003c/div>\u003c/header>\n\u003cmain>\n\n\u003csection id=\"s0\" class=\"on\">\n\u003ch2>1. Tashqi muhit ta'siri\u003c/h2>\n\u003cdiv class=\"c\">\u003cb>Tashqi muhit:\u003c/b> havo, suv, tuproq, harorat, yorug'lik, oziq-ovqat.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Havo tarkibi:\u003c/b> azot ~78%, kislorod ~21%, karbonat angidrid ~0,04%, boshqa gazlar va suv bug'i.\u003c/div>\n\u003cdiv class=\"c\">Toza havo salomatlikka foydali. Tutun va chang nafas yo'llariga zarar qiladi. Inson muhitni asraydi: daraxt ekadi, chiqindini saralaydi, filtr qo'yadi.\u003c/div>\n\u003ch3>Shahar va havo sifati\u003c/h3>\n\u003cdiv class=\"box\">\n\u003csvg id=\"sc1\" viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"Shahar manzarasi\">\u003c/svg>\n\u003clabel>🌳 Daraxtlar: \u003cb id=\"vt\">5\u003c/b>\u003cinput id=\"tr\" type=\"range\" min=\"0\" max=\"10\" value=\"5\">\u003c/label>\n\u003clabel>🚗 Mashinalar: \u003cb id=\"vc\">3\u003c/b>\u003cinput id=\"cr\" type=\"range\" min=\"0\" max=\"10\" value=\"3\">\u003c/label>\n\u003clabel>🏭 Zavod tutuni: \u003cb id=\"vf\">3\u003c/b>\u003cinput id=\"fa\" type=\"range\" min=\"0\" max=\"10\" value=\"3\">\u003c/label>\n\u003cdiv class=\"bar\">\u003ci id=\"aqb\">\u003c/i>\u003c/div>\n\u003cdiv class=\"st\" id=\"av\">🙂\u003c/div>\n\u003cdiv class=\"msg\" id=\"aqm\">\u003c/div>\n\u003c/div>\n\u003ch3>O'yin: foydali yoki zararli?\u003c/h3>\n\u003cdiv class=\"box\" id=\"g1\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s1\">\n\u003ch2>2. Tirik organizm uchun yashash muhiti\u003c/h2>\n\u003cdiv class=\"c\">\u003cb>Yashash muhitlari:\u003c/b> quruqlik-havo, suv, tuproq va tirik organizm ichi.\u003c/div>\n\u003cdiv class=\"c\">Har muhitning o'z sharoiti bor: yorug'lik, harorat, namlik, kislorod. Organizm shunga \u003cb>moslashadi\u003c/b> (adaptatsiya).\u003c/div>\n\u003cdiv class=\"c\">Misollar: baliqda jabra va suzgich, tuyada yog' saqlaydigan bo'rtiq, qutb ayig'ida qalin mo'yna, kaktusda suv saqlaydigan poya.\u003c/div>\n\u003ch3>O'yin: kim qayerda yashaydi?\u003c/h3>\n\u003cdiv class=\"box\" id=\"g2\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s2\">\n\u003ch2>3. Nafas va qon aylanish\u003c/h2>\n\u003ch3>Nafas sistemasi\u003c/h3>\n\u003cdiv class=\"c\">\u003cb>Yo'l:\u003c/b> burun → halqum → hiqildoq → kekirdak → bronxlar → o'pka (alveolalar).\u003c/div>\n\u003cdiv class=\"c\">Burun havoni isitadi, namlaydi va changdan tozalaydi. \u003cb>Alveolalarda\u003c/b> gaz almashinuvi bo'ladi: kislorod qonga o'tadi, karbonat angidrid chiqadi.\u003c/div>\n\u003cdiv class=\"c\">Nafas olganda diafragma va qovurg'a mushaklari qisqaradi, ko'krak qafasi kengayadi. Dam olganda 11–12 yoshli bola daqiqasiga taxminan 18–20 marta nafas oladi.\u003c/div>\n\u003cdiv class=\"box\">\n\u003csvg viewBox=\"0 0 300 170\" role=\"img\" aria-label=\"O'pka sxemasi (soddalashtirilgan)\">\n\u003crect width=\"300\" height=\"170\" fill=\"#ffeef0\" opacity=\".35\"/>\n\u003crect x=\"144\" y=\"8\" width=\"12\" height=\"70\" rx=\"6\" fill=\"#f4a261\"/>\n\u003cpath d=\"M150 70 L112 100 M150 70 L188 100\" stroke=\"#f4a261\" stroke-width=\"7\" fill=\"none\"/>\n\u003cellipse class=\"lung\" cx=\"105\" cy=\"105\" rx=\"46\" ry=\"52\" fill=\"#f08a9b\"/>\n\u003cellipse class=\"lung\" cx=\"195\" cy=\"105\" rx=\"46\" ry=\"52\" fill=\"#f08a9b\"/>\n\u003cg class=\"dia\">\u003cpath d=\"M40 160 Q150 140 260 160\" stroke=\"#7c4a2d\" stroke-width=\"7\" fill=\"none\"/>\u003c/g>\n\u003ctext x=\"8\" y=\"16\" font-size=\"11\" fill=\"currentColor\">sxema\u003c/text>\n\u003c/svg>\n\u003clabel>Faollik: \u003cb id=\"an\">Dam olish\u003c/b>\u003cinput id=\"ac\" type=\"range\" min=\"0\" max=\"2\" value=\"0\">\u003c/label>\n\u003cdiv class=\"msg\">💨 Nafas: \u003cb id=\"nb\">19\u003c/b> marta/daqiqa &nbsp; ❤️ Puls: \u003cb id=\"pb\">80\u003c/b> urish/daqiqa\u003c/div>\n\u003cbutton id=\"sm\">🌫️ Chang va tutun\u003c/button>\n\u003cdiv class=\"msg\" id=\"sm2\">\u003c/div>\n\u003c/div>\n\n\u003ch3>Qon aylanish sistemasi\u003c/h3>\n\u003cdiv class=\"c\">\u003cb>Yurak\u003c/b> mushakli a'zo, 4 kamerali (2 bo'lmacha, 2 qorincha), qonni haydaydi.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Tomirlar:\u003c/b> arteriya (yurakdan chiqaradi), vena (yurakka olib keladi), kapillyar (eng ingichka, almashinuv shu yerda).\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Katta doira:\u003c/b> chap qorincha → aorta → tana → o'ng bo'lmacha. \u003cb>Kichik doira:\u003c/b> o'ng qorincha → o'pka → chap bo'lmacha (qon kislorodga boyiydi).\u003c/div>\n\u003cdiv class=\"box\">\n\u003csvg viewBox=\"0 0 300 170\" role=\"img\" aria-label=\"Qon aylanishi sxemasi (soddalashtirilgan)\">\n\u003ccircle cx=\"80\" cy=\"85\" r=\"52\" fill=\"none\" stroke=\"#3b5bdb\" stroke-width=\"3\" stroke-dasharray=\"5 4\"/>\n\u003ccircle cx=\"220\" cy=\"85\" r=\"52\" fill=\"none\" stroke=\"#e5484d\" stroke-width=\"3\" stroke-dasharray=\"5 4\"/>\n\u003ctext x=\"80\" y=\"24\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\">🫁 kichik doira\u003c/text>\n\u003ctext x=\"220\" y=\"24\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\">🧍 katta doira\u003c/text>\n\u003ctext x=\"150\" y=\"98\" font-size=\"34\" text-anchor=\"middle\" id=\"ht\">🫀\u003c/text>\n\u003cg id=\"dots\">\u003c/g>\n\u003ctext x=\"150\" y=\"162\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">🔴 kislorodli qon &nbsp; 🔵 kislorodsiz qon\u003c/text>\n\u003c/svg>\n\u003cdiv class=\"msg\">Slayder yuqoridagi \"Faollik\" bilan birga puls va qon oqimini tezlashtiradi.\u003c/div>\n\u003c/div>\n\u003ch3>Qon tarkibi\u003c/h3>\n\u003cdiv class=\"box\">\n\u003cbutton data-b=\"🔴 Eritrotsit: kislorod tashiydi (gemoglobin bilan).\">🔴 Eritrotsit\u003c/button>\n\u003cbutton data-b=\"⚪ Leykotsit: mikroblarni yutib, tanani himoya qiladi.\">⚪ Leykotsit\u003c/button>\n\u003cbutton data-b=\"🩹 Trombotsit: yarada to'planib, qon ivishini ta'minlaydi.\">🩹 Trombotsit\u003c/button>\n\u003cbutton data-b=\"💧 Plazma: qonning suyuq qismi, moddalarni tashiydi.\">💧 Plazma\u003c/button>\n\u003cdiv class=\"msg\" id=\"bm\">Birini bosing.\u003c/div>\n\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Yurakni asrash:\u003c/b> harakat, sog'lom ovqat, uyqu, chekmaslik.\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s3\">\n\u003ch2>Yakuniy test\u003c/h2>\n\u003cdiv class=\"box\" id=\"g3\">\u003c/div>\n\u003c/section>\n\u003c/main>\n\n\u003cnav>\n\u003cbutton class=\"on\" data-t=\"0\">\u003cspan>🌍\u003c/span>Muhit\u003c/button>\n\u003cbutton data-t=\"1\">\u003cspan>🐪\u003c/span>Yashash\u003c/button>\n\u003cbutton data-t=\"2\">\u003cspan>🫁\u003c/span>Nafas, qon\u003c/button>\n\u003cbutton data-t=\"3\">\u003cspan>📝\u003c/span>Test\u003c/button>\n\u003c/nav>\n\n\u003cscript>\n// ---- Umumiy holat va menyu ----\nlet score=0;const $=s=>document.querySelector(s);\nconst upd=()=>{$('#sc').textContent=score};\ndocument.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));\n  document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('on',i==b.dataset.t));\n  window.scrollTo(0,0);\n});\n\n// ---- Universal savol-javob funksiyasi ----\nfunction quiz(box,items,done){\n  let i=0,ok=0;\n  const go=()=>{\n    if(i>=items.length){\n      box.innerHTML=`\u003cp class=\"q\">Natija: ${ok}/${items.length} ${done?done(ok):''}\u003c/p>\u003cbutton class=\"rs\">Qayta boshlash\u003c/button>`;\n      box.querySelector('.rs').onclick=()=>quiz(box,items,done);return;\n    }\n    const t=items[i];\n    box.innerHTML=`\u003cp class=\"q\">${t.q}\u003c/p>`+t.o.map((x,k)=>`\u003cbutton data-k=\"${k}\">${x}\u003c/button>`).join('')+'\u003cdiv class=\"msg fb\">\u003c/div>';\n    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{\n      const k=+b.dataset.k;\n      box.querySelectorAll('button').forEach(x=>x.disabled=true);\n      if(k==t.a){ok++;score+=10;b.classList.add('ok')}\n      else{b.classList.add('no');box.querySelector(`[data-k=\"${t.a}\"]`).classList.add('ok')}\n      upd();\n      box.querySelector('.fb').innerHTML=(k==t.a?'✅ To\\'g\\'ri! ':'❌ Noto\\'g\\'ri. ')+t.e+'\u003cbr>\u003cbutton class=\"nx\">Keyingisi\u003c/button>';\n      box.querySelector('.nx').onclick=()=>{i++;go()};\n    });\n  };go();\n}\n\n// ---- 1-bo'lim: shahar simulyatsiyasi ----\nfunction scene(){\n  const t=+$('#tr').value,c=+$('#cr').value,f=+$('#fa').value;\n  $('#vt').textContent=t;$('#vc').textContent=c;$('#vf').textContent=f;\n  const aq=Math.max(0,Math.min(100,60+t*5-c*4-f*5));\n  const sky=`hsl(${aq>66?200:aq>33?45:20},${25+aq*.4}%,${88-(100-aq)*.45}%)`;\n  let s=`\u003crect width=\"300\" height=\"150\" fill=\"${sky}\"/>\u003crect y=\"118\" width=\"300\" height=\"32\" fill=\"#6b8f71\"/>\u003crect y=\"132\" width=\"300\" height=\"18\" fill=\"#59616b\"/>`;\n  s+=`\u003ctext x=\"235\" y=\"118\" font-size=\"38\">🏭\u003c/text>`;\n  for(let j=0;j\u003cf;j++)s+=`\u003ctext x=\"${215+j*8}\" y=\"${90-j*7}\" font-size=\"18\" opacity=\".8\">☁️\u003c/text>`;\n  for(let j=0;j\u003ct;j++)s+=`\u003ctext x=\"${6+j*22}\" y=\"118\" font-size=\"24\">🌳\u003c/text>`;\n  for(let j=0;j\u003cc;j++)s+=`\u003ctext x=\"${8+j*28}\" y=\"146\" font-size=\"18\">🚗\u003c/text>`;\n  $('#sc1').innerHTML=s;\n  $('#aqb').style.width=aq+'%';\n  $('#aqb').style.background=aq>66?'#2b9348':aq>33?'#e9c46a':'#d62839';\n  $('#av').textContent=aq>66?'🙂':aq>33?'😐':'😷';\n  $('#aqm').textContent=aq>66?'Havo toza. Daraxtlar kislorod beradi, nafas olish yengil.':aq>33?'Havo o\\'rtacha. Tutun va mashinalar ko\\'paysa, yomonlashadi.':'Havo ifloslangan! Nafas yo\\'llariga zarar. Daraxt ko\\'paytiring, tutunni kamaytiring.';\n}\n['tr','cr','fa'].forEach(id=>$('#'+id).oninput=scene);scene();\n\nconst yes=['Foydali ✅','Zararli ⛔'];\nquiz($('#g1'),[\n ['🌳 Daraxt ekish',0,'Daraxtlar kislorod beradi va havoni tozalaydi.'],\n ['🏭 Filtrsiz zavod tutuni',1,'Tutun havoni ifloslaydi.'],\n ['🪟 Xonani shamollatish',0,'Toza havo kirib, karbonat angidrid chiqadi.'],\n ['🚬 Tutun ichida bo\\'lish',1,'Tutun o\\'pkaga zarar qiladi.'],\n ['🏃 Toza havoda yugurish',0,'Nafas va yurak mushaklari mustahkamlanadi.'],\n ['🗑️ Chiqindini yoqish',1,'Zaharli gazlar havoga chiqadi.'],\n ['🚲 Velosipedda yurish',0,'Havoni ifloslantirmaydi, sog\\'liq uchun foydali.'],\n ['🚗 Juda ko\\'p mashina',1,'Chiqindi gazlar havoni ifloslaydi.']\n].map(x=>({q:x[0],o:yes,a:x[1],e:x[2]})));\n\n// ---- 2-bo'lim: yashash muhiti ----\nconst env=['🏜️ Cho\\'l','🌊 Dengiz','🌲 O\\'rmon','🧊 Qutb'];\nquiz($('#g2'),[\n ['🐪 Tuya',0,'Bo\\'rtig\\'ida yog\\' to\\'playdi, suvsiz uzoq yura oladi.'],\n ['🐟 Baliq',1,'Jabra bilan suvda nafas oladi, suzgichi bor.'],\n ['🐻‍❄️ Qutb ayig\\'i',3,'Qalin mo\\'yna va yog\\' qatlami sovuqdan asraydi.'],\n ['🌵 Kaktus',0,'Poyasida suv saqlaydi, tikanlari suvni tejaydi.'],\n ['🐸 Qurbaqa',2,'Nam joyni yaxshi ko\\'radi, terisi orqali ham nafas oladi.'],\n ['🍄 Qo\\'ziqorin',2,'Nam va soyali o\\'rmon tuprog\\'ida o\\'sadi.'],\n ['🐧 Pingvin',3,'Yog\\' qatlami va zich patlar sovuqda isitadi.'],\n ['🦈 Akula',1,'Suvda yashaydi, jabra bilan nafas oladi.']\n].map(x=>({q:x[0]+' qayerda yashaydi?',o:env,a:x[1],e:x[2]})));\n\n// ---- 3-bo'lim: nafas va qon simulyatsiyasi ----\nconst lv=[['Dam olish',19,80,3.2,4],['Yurish',26,105,2.2,2.8],['Yugurish',40,150,1.4,1.6]];\nfunction mkDots(){\n  let s='';\n  // katta doira: qizil -> ko'k; kichik doira: ko'k -> qizil\n  [[220,'#e5484d','#3b5bdb'],[80,'#3b5bdb','#e5484d']].forEach(([cx,c1,c2])=>{\n    for(let j=0;j\u003c4;j++){\n      const p=`M ${cx} 33 a52 52 0 1 1 -0.1 0`;\n      s+=`\u003ccircle r=\"6\">\u003canimateMotion class=\"am\" dur=\"4s\" begin=\"${-j}s\" repeatCount=\"indefinite\" path=\"${p}\"/>\u003canimate attributeName=\"fill\" values=\"${c1};${c1};${c2};${c2}\" keyTimes=\"0;.5;.5;1\" calcMode=\"discrete\" dur=\"4s\" begin=\"${-j}s\" repeatCount=\"indefinite\" class=\"am\"/>\u003c/circle>`;\n    }\n  });\n  $('#dots').innerHTML=s;\n}\nmkDots();\nfunction act(){\n  const a=lv[+$('#ac').value];\n  $('#an').textContent=a[0];$('#nb').textContent=a[1];$('#pb').textContent=a[2];\n  document.documentElement.style.setProperty('--bt',a[3]+'s');\n  document.querySelectorAll('.am').forEach(e=>e.setAttribute('dur',a[4]+'s'));\n}\n$('#ac').oninput=act;act();\n$('#sm').onclick=()=>{\n  const on=document.body.classList.toggle('smoky');\n  $('#sm2').textContent=on?'😷 Chang va tutun bronxlarni toraytiradi, nafas qiyinlashadi va yo\\'tal paydo bo\\'ladi.':'';\n};\ndocument.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{$('#bm').textContent=b.dataset.b});\n\n// ---- Yakuniy test ----\nconst T=[\n ['Havoda eng ko\\'p gaz qaysi?',['Kislorod','Azot','Karbonat angidrid','Vodorod'],1,'Havoning ~78% qismi azot.'],\n ['Havoni tozalab, kislorod beradigan?',['Daraxtlar','Mashinalar','Zavod tutuni','Chang'],0,'O\\'simliklar kislorod chiqaradi.'],\n ['Havoni isitib, namlab, changdan tozalaydigan a\\'zo?',['Oshqozon','Burun','Yurak','Jigar'],1,'Burun bo\\'shlig\\'i shu vazifani bajaradi.'],\n ['Tuyaning bo\\'rtig\\'ida nima to\\'planadi?',['Suv','Havo','Yog\\'','Qon'],2,'Yog\\' energiya manbai.'],\n ['Baliq suvda nima bilan nafas oladi?',['O\\'pka','Jabra','Teri','Burun'],1,'Jabra suvdagi kislorodni oladi.'],\n ['Qutb ayig\\'i sovuqqa qanday moslashgan?',['Ingichka teri','Qalin mo\\'yna','Tikan','Qanot'],1,'Qalin mo\\'yna isitadi.'],\n ['Gaz almashinuvi qayerda bo\\'ladi?',['Kekirdakda','Burunda','Alveolalarda','Og\\'izda'],2,'Alveolalar mayda pufakchalar.'],\n ['Nafas olganda ko\\'krak qafasi qanday o\\'zgaradi?',['Kengayadi','Torayadi','O\\'zgarmaydi','Qotadi'],0,'Diafragma va qovurg\\'a mushaklari qisqaradi.'],\n ['Yurak necha kamerali?',['2','3','4','5'],2,'2 bo\\'lmacha va 2 qorincha.'],\n ['Kislorodni tashiydigan qon hujayrasi?',['Leykotsit','Trombotsit','Eritrotsit','Plazma'],2,'Eritrotsitdagi gemoglobin kislorodni biriktiradi.'],\n ['Mikroblardan himoya qiladigan hujayra?',['Eritrotsit','Leykotsit','Trombotsit','Kapillyar'],1,'Leykotsitlar mikrobni yutadi.'],\n ['Yurakdan qon olib chiqadigan tomir?',['Vena','Kapillyar','Arteriya','Bronx'],2,'Arteriya yurakdan tanaga qon olib boradi.']\n].map(x=>({q:x[0],o:x[1],a:x[2],e:x[3]}));\nquiz($('#g3'),T,ok=>'\u003cbr>'+(ok>=11?'⭐⭐⭐ Ajoyib!':ok>=8?'⭐⭐ Yaxshi!':ok>=5?'⭐ Yomon emas.':'Yana urinib ko\\'r.')+'\u003cbr>\u003csmall>Eslab qol: alveolalarda gaz almashinuvi bo\\'ladi, yurak qonni katta va kichik doira bo\\'ylab haydaydi.\u003c/small>');\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "kasal", "e": "🦠", "t": "Kasalliklar", "d": "Sog'lom turmush tarzi, kasalliklar kelib chiqishi, oldini olish", "h": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Kasalliklar | 6-sinf Tabiiy fanlar\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#f3f7ee;--cd:#fff;--tx:#23301f;--ac:#3a7d44;--rd:#d62839;--ln:#d5e2cf;--ok:#2b9348;--no:#d62839;--bl:#3b5bdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#141d12;--cd:#1f2c1c;--tx:#e8f2e4;--ac:#7ccf84;--ln:#324a2e}}\n:root[data-theme=\"dark\"]{--bg:#141d12;--cd:#1f2c1c;--tx:#e8f2e4;--ac:#7ccf84;--ln:#324a2e}\n*{box-sizing:border-box}html,body{margin:0}\nbody{background:var(--bg);color:var(--tx);font:600 17px/1.45 Nunito,system-ui,sans-serif;padding-bottom:84px}\nheader{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:2px solid var(--ln)}\nh1{font-size:19px;margin:0;font-weight:800}\n#sb{background:var(--ac);color:var(--bg);padding:4px 12px;border-radius:20px;font-weight:800}\nmain{max-width:640px;margin:0 auto;padding:12px 14px}\nsection{display:none}section.on{display:block}\nh2{font-size:21px;margin:8px 0;font-weight:800}h3{font-size:17px;margin:14px 0 6px;font-weight:800}\n.c,.box{background:var(--cd);border:2px solid var(--ln);border-radius:14px;padding:10px 12px;margin:8px 0}\n.c b{color:var(--ac)}\nbutton{font:inherit;font-weight:800;min-height:48px;padding:8px 14px;margin:4px 4px 4px 0;border-radius:12px;border:2px solid var(--ac);background:var(--cd);color:var(--tx);cursor:pointer}\nbutton:disabled{opacity:.6}button:focus-visible,input:focus-visible{outline:3px solid var(--bl);outline-offset:2px}\nbutton.ok{background:var(--ok);border-color:var(--ok);color:#fff}button.no{background:var(--no);border-color:var(--no);color:#fff}\n.q{font-size:20px;font-weight:800}.msg{margin:8px 0;font-weight:800}\nlabel{display:block;margin:8px 0 2px}input[type=range]{width:100%;height:32px;accent-color:var(--ac)}\n.bar{height:16px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .4s,background .4s}\n.av{font-size:64px;text-align:center;line-height:1.1}.pop{animation:pop .5s}\n@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1)}}\n@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}\n.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:30px;text-align:center}\n.grid span.in{animation:fl 1s infinite;background:#d6283933;border-radius:10px}\n.germs{font-size:20px;word-break:break-all;min-height:30px}\nsvg{width:100%;height:auto;display:block}\nnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:2px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}\nnav button{flex:1;margin:0;border:0;border-radius:0;min-height:60px;font-size:13px;background:none}\nnav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}nav span{display:block;font-size:22px}\n.note{font-size:14px;opacity:.85;margin:10px 0}\n@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003ch1>🦠 Kasalliklar\u003c/h1>\u003cdiv id=\"sb\">⭐ \u003cspan id=\"sc\">0\u003c/span>\u003c/div>\u003c/header>\n\u003cmain>\n\n\u003csection id=\"s0\" class=\"on\">\n\u003ch2>1. Sog'lom turmush tarzi\u003c/h2>\n\u003cdiv class=\"c\">\u003cb>Salomatlik\u003c/b> tananing jismoniy va ruhiy sog'lom holati.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Sog'lom turmush tarzi:\u003c/b> to'g'ri ovqatlanish, kuniga 9–10 soat uyqu, kamida 60 daqiqa harakat, toza havo, gigiyena, ekran vaqtini cheklash, zararli odatlardan saqlanish.\u003c/div>\n\u003cdiv class=\"c\">Bu odatlar \u003cb>immunitetni\u003c/b> (organizmning kasallikka qarshi kurashish qobiliyatini) mustahkamlaydi.\u003c/div>\n\u003ch3>Immunitet shkalasi\u003c/h3>\n\u003cdiv class=\"box\">\n\u003cdiv class=\"av\" id=\"av0\">🙂\u003c/div>\n\u003cdiv class=\"bar\">\u003ci id=\"imb\">\u003c/i>\u003c/div>\n\u003cdiv class=\"msg\">Immunitet: \u003cspan id=\"imv\">50\u003c/span>%\u003c/div>\n\u003cdiv id=\"hb\">\u003c/div>\n\u003cdiv class=\"msg\" id=\"hm\">Odatni tanlang.\u003c/div>\n\u003c/div>\n\u003ch3>O'yin: foydali yoki zararli?\u003c/h3>\n\u003cdiv class=\"box\" id=\"g1\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s1\">\n\u003ch2>2. Kasalliklarning kelib chiqishi\u003c/h2>\n\u003cdiv class=\"c\">\u003cb>Yuqumli kasalliklar\u003c/b> qo'zg'atuvchisi bor va odamdan odamga o'tadi: bakteriyalar, viruslar, zamburug'lar, parazitlar (masalan, gijjalar).\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Yuqumsiz kasalliklar\u003c/b> boshqalarga yuqmaydi. Sabablari: noto'g'ri ovqatlanish, kam harakat, zararli odatlar, travma, irsiyat, ifloslangan muhit.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Yuqish yo'llari:\u003c/b> havo-tomchi (aksirish, yo'tal), iflos qo'l, ifloslangan suv va oziq, umumiy buyumlar, hasharotlar.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Kasallik zanjiri:\u003c/b> manba → yuqish yo'li → sog'lom odam. Bitta bo'g'in uzilsa, kasallik tarqalmaydi.\u003c/div>\n\u003ch3>Mikrob tarqalishi (sxema)\u003c/h3>\n\u003cdiv class=\"box\">\n\u003cdiv class=\"grid\" id=\"ppl\">\u003c/div>\n\u003cdiv class=\"msg\">Kasallangan: \u003cspan id=\"cnt\">1\u003c/span>/12\u003c/div>\n\u003csvg viewBox=\"0 0 300 80\" aria-label=\"Tarqalish grafigi\">\u003crect width=\"300\" height=\"80\" fill=\"none\" stroke=\"currentColor\" opacity=\".25\"/>\u003cpolyline id=\"ch\" fill=\"none\" stroke=\"#d62839\" stroke-width=\"3\" points=\"\"/>\u003c/svg>\n\u003clabel>🛡️ Immunitet kuchi: \u003cb id=\"i1v\">30\u003c/b>%\u003cinput id=\"imm1\" type=\"range\" min=\"0\" max=\"100\" value=\"30\">\u003c/label>\n\u003cbutton data-n=\"4\">🤧 Aksirish\u003c/button>\u003cbutton data-n=\"2\">🤝 Qo'l siqish\u003c/button>\u003cbutton data-n=\"3\">🥤 Umumiy buyum\u003c/button>\u003cbutton data-n=\"5\">💧 Iflos suv\u003c/button>\u003cbutton id=\"rs1\">↺ Qayta\u003c/button>\n\u003cdiv class=\"msg\" id=\"sm\">\u003c/div>\n\u003c/div>\n\u003ch3>Immunitet jangi\u003c/h3>\n\u003cdiv class=\"box\">\n\u003clabel>🛡️ Immunitet kuchi: \u003cb id=\"i2v\">50\u003c/b>%\u003cinput id=\"imm2\" type=\"range\" min=\"0\" max=\"100\" value=\"50\">\u003c/label>\n\u003cbutton id=\"fb\">🦠 Mikrob hujumi\u003c/button>\n\u003cdiv class=\"germs\" id=\"fv\">🦠🦠🦠🦠🦠🦠🦠🦠🦠🦠\u003c/div>\u003cdiv class=\"germs\" id=\"fl2\">\u003c/div>\n\u003cdiv class=\"av\" id=\"av1\">🙂\u003c/div>\u003cdiv class=\"msg\" id=\"fm\">\u003c/div>\n\u003c/div>\n\u003ch3>O'yin: kasallik zanjirini uz\u003c/h3>\n\u003cdiv class=\"box\" id=\"g2\">\u003c/div>\n\u003ch3>O'yin: sabab toping\u003c/h3>\n\u003cdiv class=\"box\" id=\"g2b\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s2\">\n\u003ch2>3. Kasalliklarning oldini olish\u003c/h2>\n\u003cdiv class=\"c\">\u003cb>Gigiyena:\u003c/b> qo'lni sovun bilan kamida 20 soniya yuvish (ovqatdan oldin, hojatxonadan keyin, ko'chadan kelgach), tishni kuniga 2 marta yuvish.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Oziq va suv:\u003c/b> meva-sabzavotni yuvish, qaynatilgan yoki toza suv ichish, muddati o'tgan mahsulotni yemaslik.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Emlash:\u003c/b> organizmga zararsizlantirilgan qo'zg'atuvchi yoki uning qismi kiritiladi, immunitet kasallikni oldindan \"o'rganadi\".\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Boshqalar:\u003c/b> xonani shamollatish, aksirganda tirsak bilan yopish, sport, uyqu, karantin va izolyatsiya.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Qo'l yuvish tartibi:\u003c/b> kaft → kaft orqasi → barmoq orasi → bosh barmoq → tirnoqlar → bilak.\u003c/div>\n\u003ch3>Qo'l yuvish\u003c/h3>\n\u003cdiv class=\"box\">\n\u003cbutton id=\"hs\">🧼 Boshlash (20 soniya)\u003c/button> ⏱️ \u003cb id=\"tm\">20\u003c/b>\n\u003cdiv class=\"germs\" id=\"gm\">🦠🦠🦠🦠🦠🦠\u003c/div>\n\u003cdiv id=\"stp\">\u003c/div>\u003cdiv class=\"msg\" id=\"hw\">\u003c/div>\n\u003c/div>\n\u003ch3>Emlash (sxema)\u003c/h3>\n\u003cdiv class=\"box\">\n\u003cbutton id=\"v1\">💉 Emlangan bola\u003c/button>\u003cbutton id=\"v2\">🧒 Emlanmagan bola\u003c/button>\n\u003cdiv class=\"av\" id=\"av2\">🧒\u003c/div>\u003cdiv class=\"msg\" id=\"vm\">Birini tanlang, so'ng mikrob hujumini ko'ring.\u003c/div>\n\u003c/div>\n\u003ch3>Sog'lom kun rejasi\u003c/h3>\n\u003cdiv class=\"box\" id=\"g3\">\u003c/div>\n\u003ch3>O'yin: xavfsizmi yoki xavfli?\u003c/h3>\n\u003cdiv class=\"box\" id=\"g4\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s3\">\u003ch2>Yakuniy test\u003c/h2>\u003cdiv class=\"box\" id=\"g5\">\u003c/div>\u003c/section>\n\u003cp class=\"note\">⚕️ Kasal bo'lsang, kattalarga ayt va shifokorga murojaat qil. Dorini o'zboshimchalik bilan ichma.\u003c/p>\n\u003c/main>\n\u003cnav>\n\u003cbutton class=\"on\" data-t=\"0\">\u003cspan>🥗\u003c/span>Turmush\u003c/button>\n\u003cbutton data-t=\"1\">\u003cspan>🦠\u003c/span>Kelib chiqishi\u003c/button>\n\u003cbutton data-t=\"2\">\u003cspan>🧼\u003c/span>Oldini olish\u003c/button>\n\u003cbutton data-t=\"3\">\u003cspan>📝\u003c/span>Test\u003c/button>\n\u003c/nav>\n\u003cscript>\nlet score=0;const $=s=>document.querySelector(s),R=n=>Math.floor(Math.random()*n),upd=()=>{$('#sc').textContent=score};\ndocument.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));\n  document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('on',i==b.dataset.t));scrollTo(0,0)});\nconst pop=el=>{el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')};\n\n// Universal savol-javob (variantlar aralashtiriladi, f=true bo'lsa tartib saqlanadi)\nfunction quiz(box,items,done){\n  let i=0,ok=0;\n  const go=()=>{\n    if(i>=items.length){\n      box.innerHTML=`\u003cp class=\"q\">Natija: ${ok}/${items.length} ${done?done(ok):''}\u003c/p>\u003cbutton class=\"rs\">Qayta boshlash\u003c/button>`;\n      box.querySelector('.rs').onclick=()=>quiz(box,items,done);return}\n    const t=items[i],ord=t.o.map((_,k)=>k);if(!t.f)ord.sort(()=>Math.random()-.5);\n    box.innerHTML=`\u003cp class=\"q\">${t.q}\u003c/p>`+ord.map(k=>`\u003cbutton data-k=\"${k}\">${t.o[k]}\u003c/button>`).join('')+'\u003cdiv class=\"msg fb\">\u003c/div>';\n    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{\n      const k=+b.dataset.k;box.querySelectorAll('button').forEach(x=>x.disabled=true);\n      if(k==t.a){ok++;score+=10;b.classList.add('ok')}else{b.classList.add('no');box.querySelector(`[data-k=\"${t.a}\"]`).classList.add('ok')}\n      upd();box.querySelector('.fb').innerHTML=(k==t.a?'✅ To\\'g\\'ri! ':'❌ Noto\\'g\\'ri. ')+t.e+'\u003cbr>\u003cbutton class=\"nx\">Keyingisi\u003c/button>';\n      box.querySelector('.nx').onclick=()=>{i++;go()}});\n  };go()}\nconst mk=(arr,o,f)=>arr.map(x=>({q:x[0],o:o||x[1],a:o?x[1]:x[2],e:o?x[2]:x[3],f}));\n\n// ---- 1-bo'lim: immunitet shkalasi ----\nlet imm=50;\nconst H=[['😴 Uxlash',12,'Uyqu organizmni tiklaydi.'],['🏃 Sport',10,'Harakat immunitetni mustahkamlaydi.'],['🥕 Meva-sabzavot',10,'Vitaminlar himoya kuchini oshiradi.'],['💧 Toza suv',6,'Suv organizm uchun zarur.'],['🧼 Qo\\'l yuvish',8,'Mikroblar kamayadi.'],['📱 Kechasi telefon',-12,'Uyqu qisqaradi, immunitet pasayadi.'],['🍟 Chips, gazli ichimlik',-10,'Foydasiz ovqat organizmni zaiflashtiradi.'],['🌙 Uyqusiz qolish',-14,'Uyqusizlik organizmni holsizlantiradi.']];\n$('#hb').innerHTML=H.map((h,i)=>`\u003cbutton data-i=\"${i}\">${h[0]}\u003c/button>`).join('');\nfunction showImm(m){\n  $('#imb').style.width=imm+'%';$('#imb').style.background=imm>=70?'#2b9348':imm>=40?'#e9c46a':'#d62839';$('#imv').textContent=imm;\n  $('#av0').textContent=imm>=70?'💪':imm>=45?'🙂':imm>=25?'🤧':'🤒';pop($('#av0'));if(m)$('#hm').textContent=m}\ndocument.querySelectorAll('#hb button').forEach(b=>b.onclick=()=>{const h=H[+b.dataset.i];imm=Math.max(0,Math.min(100,imm+h[1]));showImm(h[0]+': '+h[2])});showImm();\nconst yn=['Foydali ✅','Zararli ⛔'];\nquiz($('#g1'),mk([['🍎 Har kuni meva yeyish',0,'Vitaminlar beradi.'],['🌙 Tun yarmigacha telefon',1,'Uyqu yetishmaydi.'],['🏃 Kuniga 60 daqiqa harakat',0,'Organizm mustahkamlanadi.'],['🥤 Kuniga ko\\'p gazli ichimlik',1,'Shakar ko\\'p, foyda kam.'],['🧼 Ovqatdan oldin qo\\'l yuvish',0,'Mikroblar yuvilib ketadi.'],['🍟 Faqat chips bilan ovqatlanish',1,'Organizm kerakli moddalarni olmaydi.'],['😴 9–10 soat uyqu',0,'Organizm tiklanadi.'],['🪟 Xonani shamollatish',0,'Havo toza bo\\'ladi.']],yn,true));\n\n// ---- 2-bo'lim: tarqalish ----\nlet P,hist;\nfunction resetP(){P=Array(12).fill(0);P[0]=1;hist=[1];drawP();$('#sm').textContent=''}\nfunction drawP(){\n  $('#ppl').innerHTML=P.map(x=>`\u003cspan class=\"${x?'in':''}\">${x?'🤒':'🧑'}\u003c/span>`).join('');\n  $('#cnt').textContent=P.reduce((a,b)=>a+b);\n  const n=Math.max(hist.length-1,1);\n  $('#ch').setAttribute('points',hist.map((v,i)=>`${5+i*290/n},${75-v*5.8}`).join(' '))}\ndocument.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{\n  const imv=+$('#imm1').value;let c=0;\n  for(let j=0;j\u003c+b.dataset.n;j++){const i=R(12);if(!P[i]&&Math.random()>imv/100){P[i]=1;c++}}\n  hist.push(P.reduce((a,b)=>a+b));drawP();\n  $('#sm').textContent=c?`Yangi kasallanganlar: ${c}. Kasal bo'lsang, kattalarga ayt.`:'Hech kim kasallanmadi. Immunitet himoya qildi!'});\n$('#rs1').onclick=resetP;$('#imm1').oninput=e=>{$('#i1v').textContent=e.target.value};resetP();\n\nlet ft;\n$('#imm2').oninput=e=>{$('#i2v').textContent=e.target.value};\n$('#fb').onclick=()=>{\n  clearInterval(ft);let m=10,t=0;const l=Math.max(1,Math.round(+$('#imm2').value/10));\n  $('#fl2').textContent='⚪'.repeat(l);$('#av1').textContent='🙂';$('#fm').textContent='';\n  const draw=()=>{$('#fv').textContent='🦠'.repeat(m)};draw();\n  ft=setInterval(()=>{\n    t++;m=Math.max(0,m-l+Math.floor(m*.3));draw();\n    if(m==0){clearInterval(ft);$('#av1').textContent='🙂';pop($('#av1'));$('#fm').textContent='Leykotsitlar mikroblarni yutib yubordi. Immunitet g\\'alaba qildi!'}\n    else if(t>=8||m>=20){clearInterval(ft);$('#av1').textContent='🤒';pop($('#av1'));$('#fm').textContent='Immunitet kuchsiz edi, mikroblar ko\\'paydi. Kattalarga ayt va shifokorga murojaat qil.'}\n  },700)};\n\nquiz($('#g2'),mk([\n ['Havo-tomchi yo\\'lini uzish uchun?',['Niqob taqish va xonani shamollatish','Yaqin turib gaplashish','Idishni birga ishlatish','Kech uxlash'],0,'Havo-tomchi yo\\'li yopiladi.'],\n ['Iflos qo\\'l orqali yuqishni to\\'xtatish?',['Sovun bilan 20 soniya yuvish','Qo\\'lni kiyimga artish','Yuzga tegish','Tirnoqni tishlash'],0,'Sovun mikroblarni yuvib ketadi.'],\n ['Iflos suv orqali yuqishni to\\'xtatish?',['Qaynatilgan yoki toza suv ichish','Ariq suvidan ichish','Hovuzdan ichish','Ko\\'lmak suvdan ichish'],0,'Qaynatish mikroblarni yo\\'qotadi.'],\n ['Zanjirdagi sog\\'lom odamni nima himoya qiladi?',['Immunitet va emlash','Uyqusizlik','Kam harakat','Ko\\'p shirinlik'],0,'Kuchli immunitet kasallikka yo\\'l qo\\'ymaydi.'],\n ['Kasal odam nima qilishi kerak?',['Uyda dam olib, kattalarga aytish','Maktabga borish','Do\\'stlarni quchoqlash','Dorini o\\'zi tanlash'],0,'Boshqalarga yuqmasligi uchun.'],\n ['Zanjir qachon uziladi?',['Bitta bo\\'g\\'in to\\'xtatilsa','Hech qachon','Faqat hamma kasal bo\\'lsa','Faqat qishda'],0,'Bitta bo\\'g\\'in yetarli.']]));\nquiz($('#g2b'),mk([\n ['🍔 Iflos qo\\'l bilan ovqatlandi. Nima bo\\'lishi mumkin?',['Ichak infeksiyasi xavfi','Kuchli immunitet','Tezroq o\\'sish','Hech narsa'],0,'Mikroblar ovqat bilan kiradi.'],\n ['🤧 Yonidagi odam aksirdi, yuzini yopmadi.',['Havo-tomchi bilan yuqish','Suv orqali yuqish','Hasharot orqali yuqish','Yuqmaydi'],0,'Mikroblar havoga tarqaladi.'],\n ['🛋️ Kam harakat va juda ko\\'p shirinlik.',['Yuqumsiz kasallik xavfi ortadi','Suyaklar mustahkam','Immunitet oshadi','Hech narsa'],0,'Bu yuqumsiz kasalliklar sababi.'],\n ['🚰 Ariq suvidan ichdi.',['Ichak kasalligi xavfi','Salomatlik yaxshilanadi','Kuch oshadi','Hech narsa'],0,'Suvda mikroblar bo\\'lishi mumkin.'],\n ['🌙 Har kuni juda kech yotadi.',['Immunitet susayadi','Immunitet kuchayadi','Bo\\'y o\\'sadi','Hech narsa'],0,'Uyqu yetishmasa organizm holsizlanadi.'],\n ['🪰 Ochiq qolgan ovqatga pashsha qo\\'ndi.',['Mikrob o\\'tishi mumkin','Ovqat foydali bo\\'ladi','Ovqat mazali bo\\'ladi','Hech narsa'],0,'Hasharotlar mikrob tashiydi.']]));\n\n// ---- 3-bo'lim: qo'l yuvish ----\nconst SP=['🖐️ Kaftlar','🤚 Kaft orqasi','🙌 Barmoq orasi','👍 Bosh barmoq','💅 Tirnoqlar','⌚ Bilak'];\nlet ht,hi=0,hr=false;\n$('#hs').onclick=()=>{\n  clearInterval(ht);hi=0;hr=true;let s=20;$('#tm').textContent=s;$('#hw').textContent='Qadamlarni to\\'g\\'ri tartibda bosing!';\n  $('#gm').textContent='🦠'.repeat(6);\n  const o=SP.map((_,k)=>k).sort(()=>Math.random()-.5);\n  $('#stp').innerHTML=o.map(k=>`\u003cbutton data-k=\"${k}\">${SP[k]}\u003c/button>`).join('');\n  $('#stp').querySelectorAll('button').forEach(b=>b.onclick=()=>{\n    if(!hr)return;\n    if(+b.dataset.k==hi){hi++;b.disabled=true;b.classList.add('ok');$('#gm').textContent='🦠'.repeat(6-hi);\n      if(hi==6){hr=false;clearInterval(ht);score+=20;upd();$('#hw').textContent='✨ Qo\\'llar toza! Mikroblar yo\\'qoldi.'}}\n    else $('#hw').textContent='Bu hozir emas. Tartib: kaft, kaft orqasi, barmoq orasi, bosh barmoq, tirnoq, bilak.'});\n  ht=setInterval(()=>{s--;$('#tm').textContent=s;if(s\u003c=0){clearInterval(ht);if(hr){hr=false;$('#hw').textContent='⏱️ Vaqt tugadi. Qayta urinib ko\\'ring.'}}},1000)};\nconst vac=(ok)=>{const a=$('#av2');a.textContent='🦠';setTimeout(()=>{a.textContent=ok?'😀':'🤒';pop(a);\n  $('#vm').textContent=ok?'Emlangan bolada leykotsitlar mikrobni tez taniydi va yengadi.':'Emlanmagan bola kasallikka tezroq beriladi va kasallik og\\'ir kechishi mumkin. Shifokorga murojaat qil.'},900)};\n$('#v1').onclick=()=>vac(true);$('#v2').onclick=()=>vac(false);\nquiz($('#g3'),mk([\n ['🌅 Maktabga chiqishdan oldin',['Yuz va qo\\'l yuvish, nonushta qilish','Nonushtasiz chiqish','Tirnoq tishlash','Telefon o\\'ynash'],0,'Gigiyena va ovqat kuch beradi.'],\n ['🏫 Sinfdoshing aksirdi',['Masofa saqlab, qo\\'lni yuvish','Qo\\'l siqish','Bir stakandan ichish','Hech narsa qilmaslik'],0,'Havo-tomchi xavfini kamaytiradi.'],\n ['🍎 Tushlikda olma yeyish',['Yuvib yeyish','Kiyimga artib yeyish','Yerdan olib yeyish','Yuvmay yeyish'],0,'Yuvish mikrob va changni ketkazadi.'],\n ['🌙 Kechqurun',['Xonani shamollatib, vaqtida uxlash','Kech tungacha telefon','Chips yeb yotish','Derazani butunlay yopish'],0,'Toza havo va uyqu immunitetga foyda.']]));\nquiz($('#g4'),mk([['🍏 Yuvilmagan olma',1,'Sirtida mikrob bo\\'lishi mumkin.'],['🫖 Qaynatilgan suv',0,'Mikroblar yo\\'qolgan.'],['🤧 Aksirganda yuzni ochiq qoldirish',1,'Mikroblar tarqaladi.'],['💉 Emlash jadvaliga rioya qilish',0,'Immunitetni oldindan tayyorlaydi.'],['🥛 Muddati o\\'tgan sut',1,'Zararli mikroblar ko\\'payadi.'],['🧼 Sovun bilan qo\\'l yuvish',0,'Mikroblarni yuvib ketadi.'],['🥄 Kasal bilan umumiy qoshiq',1,'Mikrob o\\'tishi mumkin.'],['🪟 Shamollatilgan xona',0,'Havodagi mikroblar kamayadi.']],['Xavfsiz ✅','Xavfli ⛔'],true));\n\n// ---- Yakuniy test ----\nquiz($('#g5'),mk([\n ['Immunitet nima?',['Organizmning kasallikka qarshi kurashish qobiliyati','Dori turi','Mikrob turi','Ovqat turi'],0,'Immunitet organizmni himoya qiladi.'],\n ['Kuniga qancha uxlash kerak (6-sinf)?',['9–10 soat','4 soat','6 soat','14 soat'],0,'Uyqu organizmni tiklaydi.'],\n ['Qaysi biri yuqumli kasallik qo\\'zg\\'atuvchisi?',['Bakteriya','Vitamin','Suv','Tuz'],0,'Bakteriya, virus, zamburug\\' va parazitlar.'],\n ['Qaysi kasallik yuqumsiz?',['Ko\\'p shirinlikdan kelib chiqqan semizlik','Gripp','Ichak infeksiyasi','Qizilcha'],0,'Yuqumsiz kasalliklar boshqalarga yuqmaydi.'],\n ['Havo-tomchi yo\\'liga qaysi biri misol?',['Aksirish va yo\\'tal','Iflos suv','Hasharot','Yaralangan joy'],0,'Mikroblar havo bilan tarqaladi.'],\n ['Kasallik zanjiri nechta bo\\'g\\'indan iborat?',['3','1','5','7'],0,'Manba, yo\\'l, sog\\'lom odam.'],\n ['Leykotsitlarning vazifasi?',['Mikroblardan himoya','Kislorod tashish','Qon ivishi','Suv saqlash'],0,'Ular mikrobni yutadi.'],\n ['Qo\\'lni kamida necha soniya yuvish kerak?',['20','2','5','60 daqiqa'],0,'Sovun bilan 20 soniya.'],\n ['Emlash nima uchun kerak?',['Immunitet kasallikni oldindan o\\'rganadi','Mikrob ko\\'paysin deb','Ovqat o\\'rniga','Uyqu uchun'],0,'Organizm tayyor bo\\'ladi.'],\n ['Meva-sabzavotni yeyishdan oldin nima qilinadi?',['Yuviladi','Yerga tashlanadi','Artilmaydi','Qoldiriladi'],0,'Mikrob va chang ketadi.'],\n ['Kasal bo\\'lganda nima qilish kerak?',['Kattalarga aytib, shifokorga murojaat qilish','Dorini o\\'zi tanlash','Maktabga borish','Hech kimga aytmaslik'],0,'Davolashni shifokor belgilaydi.'],\n ['Zanjirni qanday uzish mumkin?',['Bitta bo\\'g\\'inni to\\'xtatish','Hech qanday','Faqat dori bilan','Kuta turish'],0,'Masalan, qo\\'l yuvish yoki niqob.']]),\n ok=>'\u003cbr>'+(ok>=11?'⭐⭐⭐ Ajoyib!':ok>=8?'⭐⭐ Yaxshi!':ok>=5?'⭐ Yomon emas.':'Yana urinib ko\\'r.')+'\u003cbr>\u003csmall>Eslab qol: kasallik zanjiri 3 bo\\'g\\'indan iborat, bitta bo\\'g\\'in uzilsa kasallik tarqalmaydi. Qo\\'l yuvish, emlash va sog\\'lom turmush tarzi eng yaxshi himoya.\u003c/small>');\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "tarqalish", "e": "🧼", "t": "Kasalliklar tarqalishini oldini olish", "d": "Kasallik nima, qanday yuqadi, epidemiya simulyatori", "h": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Kasalliklar tarqalishini oldini olish | 6-sinf\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#f3f7ee;--cd:#fff;--tx:#23301f;--ac:#3a7d44;--rd:#d62839;--ln:#d5e2cf;--ok:#2b9348;--no:#d62839;--bl:#3b5bdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#141d12;--cd:#1f2c1c;--tx:#e8f2e4;--ac:#7ccf84;--ln:#324a2e}}\n:root[data-theme=\"dark\"]{--bg:#141d12;--cd:#1f2c1c;--tx:#e8f2e4;--ac:#7ccf84;--ln:#324a2e}\n*{box-sizing:border-box}html,body{margin:0}\nbody{background:var(--bg);color:var(--tx);font:600 17px/1.45 Nunito,system-ui,sans-serif;padding-bottom:84px}\nheader{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:2px solid var(--ln)}\nh1{font-size:19px;margin:0;font-weight:800}\n#sb{background:var(--ac);color:var(--bg);padding:4px 12px;border-radius:20px;font-weight:800}\nmain{max-width:640px;margin:0 auto;padding:12px 14px}\nsection{display:none}section.on{display:block}\nh2{font-size:21px;margin:8px 0;font-weight:800}h3{font-size:17px;margin:14px 0 6px;font-weight:800}\n.c,.box{background:var(--cd);border:2px solid var(--ln);border-radius:14px;padding:10px 12px;margin:8px 0}\n.c b{color:var(--ac)}\nbutton{font:inherit;font-weight:800;min-height:48px;padding:8px 14px;margin:4px 4px 4px 0;border-radius:12px;border:2px solid var(--ac);background:var(--cd);color:var(--tx);cursor:pointer}\nbutton:disabled{opacity:.6}button:focus-visible,input:focus-visible{outline:3px solid var(--bl);outline-offset:2px}\nbutton.ok{background:var(--ok);border-color:var(--ok);color:#fff}button.no{background:var(--no);border-color:var(--no);color:#fff}\n.q{font-size:20px;font-weight:800}.msg{margin:8px 0;font-weight:800}\nlabel{display:block;margin:8px 0 2px}input[type=range]{width:100%;height:32px;accent-color:var(--ac)}\n.bar{height:16px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .4s,background .4s}\n.av{font-size:64px;text-align:center;line-height:1.1}.pop{animation:pop .5s}\n@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1)}}\n@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}\n.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:30px;text-align:center}\n.grid span.in{animation:fl 1s infinite;background:#d6283933;border-radius:10px}\n.germs{font-size:20px;word-break:break-all;min-height:30px}\nsvg{width:100%;height:auto;display:block}\nnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:2px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}\nnav button{flex:1;margin:0;border:0;border-radius:0;min-height:60px;font-size:13px;background:none}\nnav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}nav span{display:block;font-size:22px}\n.note{font-size:14px;opacity:.85;margin:10px 0}\n.grid2{display:grid;grid-template-columns:repeat(10,1fr);font-size:20px;text-align:center;line-height:1.35;margin:8px 0}\n.grid2 span.k{animation:fl 1s infinite}\n#sb{display:inline-block}#snd{min-height:40px;min-width:48px;padding:4px 8px;margin:0 8px 0 0}\n@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003ch1>🦠 Kasalliklar\u003c/h1>\u003cdiv>\u003cbutton id=\"snd\" aria-pressed=\"true\" aria-label=\"Ovozni o'chirish\">🔊\u003c/button>\u003cspan id=\"sb\">⭐ \u003cspan id=\"sc\">0\u003c/span>\u003c/span>\u003c/div>\u003c/header>\n\u003cmain>\n\n\u003csection id=\"s0\" class=\"on\">\n\u003ch2>1. Kasallik nima\u003c/h2>\n\u003cdiv class=\"c\">\u003cb>Kasallik\u003c/b> organizm faoliyatining buzilishi. \u003cb>Salomatlik\u003c/b> esa tananing jismoniy va ruhiy sog'lom holati.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Kasallik belgilari:\u003c/b> isitma, yo'tal, aksirish, holsizlik, og'riq, ishtaha yo'qolishi. Belgilar paydo bo'lsa, kattalarga ayt.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Yuqumli kasalliklar\u003c/b> odamdan odamga o'tadi. Qo'zg'atuvchilari: bakteriyalar, viruslar, zamburug'lar, parazitlar. Misol: gripp, angina, qizilcha.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Yuqumsiz kasalliklar\u003c/b> boshqalarga yuqmaydi. Sabablari: noto'g'ri ovqatlanish, kam harakat, zararli odatlar, irsiyat, travma. Misol: semizlik, allergiya.\u003c/div>\n\u003cdiv class=\"c\">Organizmni \u003cb>immunitet\u003c/b> himoya qiladi: leykotsitlar mikrobni yutadi va antitana ishlab chiqaradi.\u003c/div>\n\u003ch3>Immunitet shkalasi\u003c/h3>\n\u003cdiv class=\"box\">\n\u003cdiv class=\"av\" id=\"av0\">🙂\u003c/div>\n\u003cdiv class=\"bar\">\u003ci id=\"imb\">\u003c/i>\u003c/div>\n\u003cdiv class=\"msg\">Immunitet: \u003cspan id=\"imv\">50\u003c/span>%\u003c/div>\n\u003cdiv id=\"hb\">\u003c/div>\n\u003cdiv class=\"msg\" id=\"hm\">Odatni tanlang.\u003c/div>\n\u003c/div>\n\u003ch3>Kasallik qanday boshlanadi? (immunitet jangi)\u003c/h3>\n\u003cdiv class=\"box\">\n\u003clabel>🛡️ Immunitet kuchi: \u003cb id=\"i2v\">50\u003c/b>%\u003cinput id=\"imm2\" type=\"range\" min=\"0\" max=\"100\" value=\"50\">\u003c/label>\n\u003cbutton id=\"fb\">🦠 Mikrob hujumi\u003c/button>\n\u003cdiv class=\"germs\" id=\"fv\">🦠🦠🦠🦠🦠🦠🦠🦠🦠🦠\u003c/div>\u003cdiv class=\"germs\" id=\"fl2\">\u003c/div>\n\u003cdiv class=\"av\" id=\"av1\">🙂\u003c/div>\u003cdiv class=\"msg\" id=\"fm\">\u003c/div>\n\u003c/div>\n\u003ch3>O'yin: yuqumli yoki yuqumsiz?\u003c/h3>\n\u003cdiv class=\"box\" id=\"g1\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s1\">\n\u003ch2>2. Insonga kasallik qanday yuqadi\u003c/h2>\n\u003cdiv class=\"c\">\u003cb>Yuqumli kasalliklar\u003c/b> qo'zg'atuvchisi bor va odamdan odamga o'tadi: bakteriyalar, viruslar, zamburug'lar, parazitlar (masalan, gijjalar).\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Yuqumsiz kasalliklar\u003c/b> boshqalarga yuqmaydi. Sabablari: noto'g'ri ovqatlanish, kam harakat, zararli odatlar, travma, irsiyat, ifloslangan muhit.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Yuqish yo'llari:\u003c/b> havo-tomchi (aksirish, yo'tal), iflos qo'l, ifloslangan suv va oziq, umumiy buyumlar, hasharotlar.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Kasallik zanjiri:\u003c/b> manba → yuqish yo'li → sog'lom odam. Bitta bo'g'in uzilsa, kasallik tarqalmaydi.\u003c/div>\n\u003ch3>Mikrob tarqalishi (sxema)\u003c/h3>\n\u003cdiv class=\"box\">\n\u003cdiv class=\"grid\" id=\"ppl\">\u003c/div>\n\u003cdiv class=\"msg\">Kasallangan: \u003cspan id=\"cnt\">1\u003c/span>/12\u003c/div>\n\u003csvg viewBox=\"0 0 300 80\" aria-label=\"Tarqalish grafigi\">\u003crect width=\"300\" height=\"80\" fill=\"none\" stroke=\"currentColor\" opacity=\".25\"/>\u003cpolyline id=\"ch\" fill=\"none\" stroke=\"#d62839\" stroke-width=\"3\" points=\"\"/>\u003c/svg>\n\u003clabel>🛡️ Immunitet kuchi: \u003cb id=\"i1v\">30\u003c/b>%\u003cinput id=\"imm1\" type=\"range\" min=\"0\" max=\"100\" value=\"30\">\u003c/label>\n\u003cbutton data-n=\"4\">🤧 Aksirish\u003c/button>\u003cbutton data-n=\"2\">🤝 Qo'l siqish\u003c/button>\u003cbutton data-n=\"3\">🥤 Umumiy buyum\u003c/button>\u003cbutton data-n=\"5\">💧 Iflos suv\u003c/button>\u003cbutton id=\"rs1\">↺ Qayta\u003c/button>\n\u003cdiv class=\"msg\" id=\"sm\">\u003c/div>\n\u003c/div>\n\u003ch3>O'yin: kasallik zanjirini uz\u003c/h3>\n\u003cdiv class=\"box\" id=\"g2\">\u003c/div>\n\u003ch3>O'yin: sabab toping\u003c/h3>\n\u003cdiv class=\"box\" id=\"g2b\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s2\">\n\u003ch2>3. Kasalliklarga qarshi yo'llar\u003c/h2>\n\u003cdiv class=\"c\">\u003cb>Gigiyena:\u003c/b> qo'lni sovun bilan kamida 20 soniya yuvish (ovqatdan oldin, hojatxonadan keyin, ko'chadan kelgach), tishni kuniga 2 marta yuvish.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Oziq va suv:\u003c/b> meva-sabzavotni yuvish, qaynatilgan yoki toza suv ichish, muddati o'tgan mahsulotni yemaslik.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Emlash:\u003c/b> organizmga zararsizlantirilgan qo'zg'atuvchi yoki uning qismi kiritiladi, immunitet kasallikni oldindan \"o'rganadi\".\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Boshqalar:\u003c/b> xonani shamollatish, aksirganda tirsak bilan yopish, sport, uyqu, karantin va izolyatsiya.\u003c/div>\n\u003cdiv class=\"c\">\u003cb>Qo'l yuvish tartibi:\u003c/b> kaft → kaft orqasi → barmoq orasi → bosh barmoq → tirnoqlar → bilak.\u003c/div>\n\u003ch3>Qo'l yuvish\u003c/h3>\n\u003cdiv class=\"box\">\n\u003cbutton id=\"hs\">🧼 Boshlash (20 soniya)\u003c/button> ⏱️ \u003cb id=\"tm\">20\u003c/b>\n\u003cdiv class=\"germs\" id=\"gm\">🦠🦠🦠🦠🦠🦠\u003c/div>\n\u003cdiv id=\"stp\">\u003c/div>\u003cdiv class=\"msg\" id=\"hw\">\u003c/div>\n\u003c/div>\n\u003ch3>Emlash (sxema)\u003c/h3>\n\u003cdiv class=\"box\">\n\u003cbutton id=\"v1\">💉 Emlangan bola\u003c/button>\u003cbutton id=\"v2\">🧒 Emlanmagan bola\u003c/button>\n\u003cdiv class=\"av\" id=\"av2\">🧒\u003c/div>\u003cdiv class=\"msg\" id=\"vm\">Birini tanlang, so'ng mikrob hujumini ko'ring.\u003c/div>\n\u003c/div>\n\u003ch3>Epidemiya simulyatori (sxema)\u003c/h3>\n\u003cdiv class=\"box\">\n\u003cdiv class=\"c\">Sinfdagi 100 bolaning 2 tasi kasal. Himoya choralarini tanlang va kasallik 30 kun ichida qanday tarqalishini kuzating.\u003c/div>\n\u003clabel>💉 Emlanganlar: \u003cb id=\"evv\">0\u003c/b>%\u003cinput id=\"ev\" type=\"range\" min=\"0\" max=\"90\" step=\"10\" value=\"0\">\u003c/label>\n\u003cbutton id=\"ew\" aria-pressed=\"false\">🧼 Qo'l yuvish: o'chiq\u003c/button>\u003cbutton id=\"em\" aria-pressed=\"false\">😷 Niqob: o'chiq\u003c/button>\n\u003cbutton id=\"er\">▶ Boshlash\u003c/button>\n\u003cdiv class=\"grid2\" id=\"epg\">\u003c/div>\n\u003cdiv class=\"msg\">Kun: \u003cb id=\"ed\">0\u003c/b> &nbsp; Kasal: \u003cb id=\"ek\">2\u003c/b> &nbsp; Jami kasallangan: \u003cb id=\"etl\">2\u003c/b>\u003c/div>\n\u003csvg viewBox=\"0 0 300 80\" aria-label=\"Kasallar soni grafigi\">\u003crect width=\"300\" height=\"80\" fill=\"none\" stroke=\"currentColor\" opacity=\".25\"/>\u003cpolyline id=\"ec\" fill=\"none\" stroke=\"#d62839\" stroke-width=\"3\" points=\"\"/>\u003c/svg>\n\u003cdiv class=\"msg\" id=\"eo\">\u003c/div>\n\u003cdiv class=\"note\">🧑 sog'lom &nbsp; 🤒 kasal &nbsp; 😀 tuzalgan &nbsp; 🛡️ emlangan\u003c/div>\n\u003c/div>\n\u003ch3>Sog'lom kun rejasi\u003c/h3>\n\u003cdiv class=\"box\" id=\"g3\">\u003c/div>\n\u003ch3>O'yin: xavfsizmi yoki xavfli?\u003c/h3>\n\u003cdiv class=\"box\" id=\"g4\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s3\">\u003ch2>Yakuniy test\u003c/h2>\u003cdiv class=\"box\" id=\"g5\">\u003c/div>\u003c/section>\n\u003cp class=\"note\">⚕️ Kasal bo'lsang, kattalarga ayt va shifokorga murojaat qil. Dorini o'zboshimchalik bilan ichma.\u003c/p>\n\u003c/main>\n\u003cnav>\n\u003cbutton class=\"on\" data-t=\"0\">\u003cspan>🦠\u003c/span>Kasallik nima\u003c/button>\n\u003cbutton data-t=\"1\">\u003cspan>🤧\u003c/span>Qanday yuqadi\u003c/button>\n\u003cbutton data-t=\"2\">\u003cspan>🧼\u003c/span>Qarshi yo'llar\u003c/button>\n\u003cbutton data-t=\"3\">\u003cspan>📝\u003c/span>Test\u003c/button>\n\u003c/nav>\n\u003cscript>\nlet score=0;const $=s=>document.querySelector(s),R=n=>Math.floor(Math.random()*n),upd=()=>{$('#sc').textContent=score};\ndocument.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));\n  document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('on',i==b.dataset.t));scrollTo(0,0)});\n// Ovoz (Web Audio): to'g'ri javobda baland, noto'g'rida past signal\nlet sOn=true,AC;\nconst beep=ok=>{if(!sOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=ok?660:200;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.15)}catch(e){}};\n$('#snd').onclick=e=>{sOn=!sOn;e.target.textContent=sOn?'🔊':'🔇';e.target.setAttribute('aria-pressed',sOn)};\nconst pop=el=>{el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')};\n\n// Universal savol-javob (variantlar aralashtiriladi, f=true bo'lsa tartib saqlanadi)\nfunction quiz(box,items,done){\n  let i=0,ok=0;\n  const go=()=>{\n    if(i>=items.length){\n      box.innerHTML=`\u003cp class=\"q\">Natija: ${ok}/${items.length} ${done?done(ok):''}\u003c/p>\u003cbutton class=\"rs\">Qayta boshlash\u003c/button>`;\n      box.querySelector('.rs').onclick=()=>quiz(box,items,done);return}\n    const t=items[i],ord=t.o.map((_,k)=>k);if(!t.f)ord.sort(()=>Math.random()-.5);\n    box.innerHTML=`\u003cp class=\"q\">${t.q}\u003c/p>`+ord.map(k=>`\u003cbutton data-k=\"${k}\">${t.o[k]}\u003c/button>`).join('')+'\u003cdiv class=\"msg fb\">\u003c/div>';\n    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{\n      const k=+b.dataset.k;box.querySelectorAll('button').forEach(x=>x.disabled=true);\n      if(k==t.a){ok++;score+=10;b.classList.add('ok')}else{b.classList.add('no');box.querySelector(`[data-k=\"${t.a}\"]`).classList.add('ok')}\n      upd();beep(k==t.a);box.querySelector('.fb').innerHTML=(k==t.a?'✅ To\\'g\\'ri! ':'❌ Noto\\'g\\'ri. ')+t.e+'\u003cbr>\u003cbutton class=\"nx\">Keyingisi\u003c/button>';\n      box.querySelector('.nx').onclick=()=>{i++;go()}});\n  };go()}\nconst mk=(arr,o,f)=>arr.map(x=>({q:x[0],o:o||x[1],a:o?x[1]:x[2],e:o?x[2]:x[3],f}));\n\n// ---- 1-bo'lim: immunitet shkalasi ----\nlet imm=50;\nconst H=[['😴 Uxlash',12,'Uyqu organizmni tiklaydi.'],['🏃 Sport',10,'Harakat immunitetni mustahkamlaydi.'],['🥕 Meva-sabzavot',10,'Vitaminlar himoya kuchini oshiradi.'],['💧 Toza suv',6,'Suv organizm uchun zarur.'],['🧼 Qo\\'l yuvish',8,'Mikroblar kamayadi.'],['📱 Kechasi telefon',-12,'Uyqu qisqaradi, immunitet pasayadi.'],['🍟 Chips, gazli ichimlik',-10,'Foydasiz ovqat organizmni zaiflashtiradi.'],['🌙 Uyqusiz qolish',-14,'Uyqusizlik organizmni holsizlantiradi.']];\n$('#hb').innerHTML=H.map((h,i)=>`\u003cbutton data-i=\"${i}\">${h[0]}\u003c/button>`).join('');\nfunction showImm(m){\n  $('#imb').style.width=imm+'%';$('#imb').style.background=imm>=70?'#2b9348':imm>=40?'#e9c46a':'#d62839';$('#imv').textContent=imm;\n  $('#av0').textContent=imm>=70?'💪':imm>=45?'🙂':imm>=25?'🤧':'🤒';pop($('#av0'));if(m)$('#hm').textContent=m}\ndocument.querySelectorAll('#hb button').forEach(b=>b.onclick=()=>{const h=H[+b.dataset.i];imm=Math.max(0,Math.min(100,imm+h[1]));showImm(h[0]+': '+h[2])});showImm();\nconst yn=['Foydali ✅','Zararli ⛔'];\nquiz($('#g1'),mk([['🤧 Gripp',0,'Virus qo\\'zg\\'atadi, odamdan odamga o\\'tadi.'],['🍔 Semizlik',1,'Noto\\'g\\'ri ovqatlanish va kam harakatdan, yuqmaydi.'],['😷 Angina',0,'Bakteriyalar qo\\'zg\\'atadi, yuqadi.'],['🌼 Allergiya',1,'Organizmning o\\'ziga xos reaksiyasi, yuqmaydi.'],['🚽 Ichak infeksiyasi',0,'Iflos qo\\'l, suv va oziq orqali yuqadi.'],['🦴 Suyak sinishi',1,'Jarohat, yuqmaydi.'],['🔴 Qizilcha',0,'Virus qo\\'zg\\'atadi, havo-tomchi bilan yuqadi.']],['Yuqumli 🦠','Yuqumsiz 🚫'],true));\n\n// ---- 2-bo'lim: tarqalish ----\nlet P,hist;\nfunction resetP(){P=Array(12).fill(0);P[0]=1;hist=[1];drawP();$('#sm').textContent=''}\nfunction drawP(){\n  $('#ppl').innerHTML=P.map(x=>`\u003cspan class=\"${x?'in':''}\">${x?'🤒':'🧑'}\u003c/span>`).join('');\n  $('#cnt').textContent=P.reduce((a,b)=>a+b);\n  const n=Math.max(hist.length-1,1);\n  $('#ch').setAttribute('points',hist.map((v,i)=>`${5+i*290/n},${75-v*5.8}`).join(' '))}\ndocument.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{\n  const imv=+$('#imm1').value;let c=0;\n  for(let j=0;j\u003c+b.dataset.n;j++){const i=R(12);if(!P[i]&&Math.random()>imv/100){P[i]=1;c++}}\n  hist.push(P.reduce((a,b)=>a+b));drawP();\n  $('#sm').textContent=c?`Yangi kasallanganlar: ${c}. Kasal bo'lsang, kattalarga ayt.`:'Hech kim kasallanmadi. Immunitet himoya qildi!'});\n$('#rs1').onclick=resetP;$('#imm1').oninput=e=>{$('#i1v').textContent=e.target.value};resetP();\n\nlet ft;\n$('#imm2').oninput=e=>{$('#i2v').textContent=e.target.value};\n$('#fb').onclick=()=>{\n  clearInterval(ft);let m=10,t=0;const l=Math.max(1,Math.round(+$('#imm2').value/10));\n  $('#fl2').textContent='⚪'.repeat(l);$('#av1').textContent='🙂';$('#fm').textContent='';\n  const draw=()=>{$('#fv').textContent='🦠'.repeat(m)};draw();\n  ft=setInterval(()=>{\n    t++;m=Math.max(0,m-l+Math.floor(m*.3));draw();\n    if(m==0){clearInterval(ft);$('#av1').textContent='🙂';pop($('#av1'));$('#fm').textContent='Leykotsitlar mikroblarni yutib yubordi. Immunitet g\\'alaba qildi!'}\n    else if(t>=8||m>=20){clearInterval(ft);$('#av1').textContent='🤒';pop($('#av1'));$('#fm').textContent='Immunitet kuchsiz edi, mikroblar ko\\'paydi. Kattalarga ayt va shifokorga murojaat qil.'}\n  },700)};\n\nquiz($('#g2'),mk([\n ['Havo-tomchi yo\\'lini uzish uchun?',['Niqob taqish va xonani shamollatish','Yaqin turib gaplashish','Idishni birga ishlatish','Kech uxlash'],0,'Havo-tomchi yo\\'li yopiladi.'],\n ['Iflos qo\\'l orqali yuqishni to\\'xtatish?',['Sovun bilan 20 soniya yuvish','Qo\\'lni kiyimga artish','Yuzga tegish','Tirnoqni tishlash'],0,'Sovun mikroblarni yuvib ketadi.'],\n ['Iflos suv orqali yuqishni to\\'xtatish?',['Qaynatilgan yoki toza suv ichish','Ariq suvidan ichish','Hovuzdan ichish','Ko\\'lmak suvdan ichish'],0,'Qaynatish mikroblarni yo\\'qotadi.'],\n ['Zanjirdagi sog\\'lom odamni nima himoya qiladi?',['Immunitet va emlash','Uyqusizlik','Kam harakat','Ko\\'p shirinlik'],0,'Kuchli immunitet kasallikka yo\\'l qo\\'ymaydi.'],\n ['Kasal odam nima qilishi kerak?',['Uyda dam olib, kattalarga aytish','Maktabga borish','Do\\'stlarni quchoqlash','Dorini o\\'zi tanlash'],0,'Boshqalarga yuqmasligi uchun.'],\n ['Zanjir qachon uziladi?',['Bitta bo\\'g\\'in to\\'xtatilsa','Hech qachon','Faqat hamma kasal bo\\'lsa','Faqat qishda'],0,'Bitta bo\\'g\\'in yetarli.']]));\nquiz($('#g2b'),mk([\n ['🍔 Iflos qo\\'l bilan ovqatlandi. Nima bo\\'lishi mumkin?',['Ichak infeksiyasi xavfi','Kuchli immunitet','Tezroq o\\'sish','Hech narsa'],0,'Mikroblar ovqat bilan kiradi.'],\n ['🤧 Yonidagi odam aksirdi, yuzini yopmadi.',['Havo-tomchi bilan yuqish','Suv orqali yuqish','Hasharot orqali yuqish','Yuqmaydi'],0,'Mikroblar havoga tarqaladi.'],\n ['🛋️ Kam harakat va juda ko\\'p shirinlik.',['Yuqumsiz kasallik xavfi ortadi','Suyaklar mustahkam','Immunitet oshadi','Hech narsa'],0,'Bu yuqumsiz kasalliklar sababi.'],\n ['🚰 Ariq suvidan ichdi.',['Ichak kasalligi xavfi','Salomatlik yaxshilanadi','Kuch oshadi','Hech narsa'],0,'Suvda mikroblar bo\\'lishi mumkin.'],\n ['🌙 Har kuni juda kech yotadi.',['Immunitet susayadi','Immunitet kuchayadi','Bo\\'y o\\'sadi','Hech narsa'],0,'Uyqu yetishmasa organizm holsizlanadi.'],\n ['🪰 Ochiq qolgan ovqatga pashsha qo\\'ndi.',['Mikrob o\\'tishi mumkin','Ovqat foydali bo\\'ladi','Ovqat mazali bo\\'ladi','Hech narsa'],0,'Hasharotlar mikrob tashiydi.']]));\n\n// ---- 3-bo'lim: qo'l yuvish ----\nconst SP=['🖐️ Kaftlar','🤚 Kaft orqasi','🙌 Barmoq orasi','👍 Bosh barmoq','💅 Tirnoqlar','⌚ Bilak'];\nlet ht,hi=0,hr=false;\n$('#hs').onclick=()=>{\n  clearInterval(ht);hi=0;hr=true;let s=20;$('#tm').textContent=s;$('#hw').textContent='Qadamlarni to\\'g\\'ri tartibda bosing!';\n  $('#gm').textContent='🦠'.repeat(6);\n  const o=SP.map((_,k)=>k).sort(()=>Math.random()-.5);\n  $('#stp').innerHTML=o.map(k=>`\u003cbutton data-k=\"${k}\">${SP[k]}\u003c/button>`).join('');\n  $('#stp').querySelectorAll('button').forEach(b=>b.onclick=()=>{\n    if(!hr)return;\n    if(+b.dataset.k==hi){hi++;b.disabled=true;b.classList.add('ok');$('#gm').textContent='🦠'.repeat(6-hi);\n      if(hi==6){hr=false;clearInterval(ht);score+=20;upd();$('#hw').textContent='✨ Qo\\'llar toza! Mikroblar yo\\'qoldi.'}}\n    else $('#hw').textContent='Bu hozir emas. Tartib: kaft, kaft orqasi, barmoq orasi, bosh barmoq, tirnoq, bilak.'});\n  ht=setInterval(()=>{s--;$('#tm').textContent=s;if(s\u003c=0){clearInterval(ht);if(hr){hr=false;$('#hw').textContent='⏱️ Vaqt tugadi. Qayta urinib ko\\'ring.'}}},1000)};\nconst vac=(ok)=>{const a=$('#av2');a.textContent='🦠';setTimeout(()=>{a.textContent=ok?'😀':'🤒';pop(a);\n  $('#vm').textContent=ok?'Emlangan bolada leykotsitlar mikrobni tez taniydi va yengadi.':'Emlanmagan bola kasallikka tezroq beriladi va kasallik og\\'ir kechishi mumkin. Shifokorga murojaat qil.'},900)};\n$('#v1').onclick=()=>vac(true);$('#v2').onclick=()=>vac(false);\nquiz($('#g3'),mk([\n ['🌅 Maktabga chiqishdan oldin',['Yuz va qo\\'l yuvish, nonushta qilish','Nonushtasiz chiqish','Tirnoq tishlash','Telefon o\\'ynash'],0,'Gigiyena va ovqat kuch beradi.'],\n ['🏫 Sinfdoshing aksirdi',['Masofa saqlab, qo\\'lni yuvish','Qo\\'l siqish','Bir stakandan ichish','Hech narsa qilmaslik'],0,'Havo-tomchi xavfini kamaytiradi.'],\n ['🍎 Tushlikda olma yeyish',['Yuvib yeyish','Kiyimga artib yeyish','Yerdan olib yeyish','Yuvmay yeyish'],0,'Yuvish mikrob va changni ketkazadi.'],\n ['🌙 Kechqurun',['Xonani shamollatib, vaqtida uxlash','Kech tungacha telefon','Chips yeb yotish','Derazani butunlay yopish'],0,'Toza havo va uyqu immunitetga foyda.']]));\nquiz($('#g4'),mk([['🍏 Yuvilmagan olma',1,'Sirtida mikrob bo\\'lishi mumkin.'],['🫖 Qaynatilgan suv',0,'Mikroblar yo\\'qolgan.'],['🤧 Aksirganda yuzni ochiq qoldirish',1,'Mikroblar tarqaladi.'],['💉 Emlash jadvaliga rioya qilish',0,'Immunitetni oldindan tayyorlaydi.'],['🥛 Muddati o\\'tgan sut',1,'Zararli mikroblar ko\\'payadi.'],['🧼 Sovun bilan qo\\'l yuvish',0,'Mikroblarni yuvib ketadi.'],['🥄 Kasal bilan umumiy qoshiq',1,'Mikrob o\\'tishi mumkin.'],['🪟 Shamollatilgan xona',0,'Havodagi mikroblar kamayadi.']],['Xavfsiz ✅','Xavfli ⛔'],true));\n\n// ---- Epidemiya simulyatori: 100 bola, har kasal kuniga 4 kishi bilan aloqa, 4 kunda tuzaladi ----\nlet E,eh,eDay=0,eTm,wash=false,mask=false;\nconst cnt=s=>E.filter(x=>x.s==s).length;\nfunction eDraw(){\n  $('#epg').innerHTML=E.map(x=>`\u003cspan class=\"${x.s==1?'k':''}\">${['🧑','🤒','😀','🛡️'][x.s]}\u003c/span>`).join('');\n  const k=cnt(1);$('#ed').textContent=eDay;$('#ek').textContent=k;$('#etl').textContent=k+cnt(2);\n  const n=Math.max(eh.length-1,1);\n  $('#ec').setAttribute('points',eh.map((v,i)=>`${5+i*290/n},${75-v*.7}`).join(' '))}\nfunction eSetup(){\n  clearInterval(eTm);eDay=0;const v=+$('#ev').value;\n  E=Array.from({length:100},()=>({s:0,d:0}));\n  const ix=[...Array(100).keys()].sort(()=>Math.random()-.5);\n  ix.slice(0,2).forEach(i=>E[i]={s:1,d:0});ix.slice(2,2+v).forEach(i=>E[i]={s:3,d:0});\n  eh=[2];$('#eo').textContent='';eDraw()}\nfunction eStep()
