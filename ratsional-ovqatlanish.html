@keyframes run{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px) rotate(10deg)}}

function beep(f = 600, d = .12){
  if(!S.snd) return;
  try{
    const a = beep.c || (beep.c = new (window.AudioContext || window.webkitAudioContext)());
    const o = a.createOscillator(), g = a.createGain();
    o.frequency.value = f; g.gain.value = .08; o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + d);
  }catch(e){}
}

/* ===================== SUDRAB QO'YISH + BOSIB TANLASH ===================== */
// Sudrash (pointer events: telefonda ham ishlaydi)
function drag(el, zones, cb){
  el.addEventListener("pointerdown", e => {
    let moved = false, g; const sx = e.clientX, sy = e.clientY;
    const mv = ev => {
      if(!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
      if(!moved){ moved = true; g = el.cloneNode(true); g.classList.add("ghost"); document.body.appendChild(g); }
      g.style.left = ev.clientX - 60 + "px"; g.style.top = ev.clientY - 40 + "px";
    };
    const up = ev => {
      removeEventListener("pointermove", mv); removeEventListener("pointerup", up);
      if(moved){
        g.remove();
        const t = document.elementFromPoint(ev.clientX, ev.clientY);
        const z = t && t.closest(zones); if(z) cb(el, z);
        el._d = true; setTimeout(() => el._d = false, 50);
      }
    };
    addEventListener("pointermove", mv); addEventListener("pointerup", up);
  });
}
// Ikkala usul: sudrash yoki "kartani bos, keyin joyni bos"
function wire(cards, zones, cb){
  let sel = null;
  cards.forEach(c => {
    drag(c, zones, cb);
    c.addEventListener("click", () => { if(c._d) return; cards.forEach(x => x.classList.remove("sel")); sel = c; c.classList.add("sel"); });
  });
  $$(zones).forEach(z => z.addEventListener("click", () => { if(sel && sel.isConnected){ const s = sel; sel.classList.remove("sel"); sel = null; cb(s, z); } }));
}

const D1 = {h:60, en:60, m:60, tv:0};
function bars(){
  return [["h","Salomatlik"],["en","Energiya"],["m","Kayfiyat"]].map(([k,n]) => `<div>${n}: <b id="t-${k}">${D1[k]}</b>%</div><div class="bar"><i id="b-${k}" style="width:${D1[k]}%"></i></div>`).join("");
}
function buildS1(){
  $("#v-s1").innerHTML = `<h1>🌿 Sog'lom turmush tarzi</h1>${avHTML(1)}${theory("s1")}
  <h2>🎮 Mening kunim</h2><div class="card">${bars()}</div>
  <h3>Foydali odatlar</h3><div class="row" id="hab"></div>
  <h3>Zararli odatlar</h3><div class="row" id="bad"></div>
  <h2>🧩 Odatni top</h2><div class="card">Kartani "Foydali" yoki "Zararli" savatiga sudra (yoki kartani bos, keyin savatni bos).</div>
  <div class="grid" id="hc"></div>
  <div class="row" style="margin-top:8px"><div class="zone good" data-k="1" style="flex:1">✅ Foydali</div><div class="zone badz" data-k="0" style="flex:1">⚠️ Zararli</div></div>
  <div id="hmsg"></div>`;

  });

    if(el.dataset.g === z.dataset.k){ el.remove(); add(10); good(); setAv(1, "happy", "To'g'ri! +10 ball 🎉", "jump", "⭐");
      if(!$("#hc .dc")){ $("#hmsg").innerHTML = `<div class="okmsg">Barcha odatlar to'g'ri joylandi! 🏆</div>`; add(0, 1); confetti(); } }
    else { bad(); el.classList.add("wrong"); setTimeout(() => el.classList.remove("wrong"), 500); setAv(1, "sad", "Yo'q, qaytadan o'ylab ko'r 🤔", "shake"); }
  });
  setAv(1, "happy", "Odatlarni bos va nima bo'lishini ko'r!");

function habit(h, harm){
  let x = h, msg;
  if(h.tv){ // telefon/TV: 2 martadan keyin zararli
    D1.tv++;
    x = D1.tv > 2 ? {h:-10,en:-10,m:-5,a:"yawn",t:"Juda ko'p ekran! Ko'zlar charchaydi, harakat kam bo'ladi. 2 soatdan oshmasin!"} : {h:0,en:-3,m:3,a:"jump",fx:"📺",t:"1 soat ko'rdim — bo'ladi. Jami 2 soatdan oshmasin."};
    harm = D1.tv > 2;
  }
  D1.h = clamp(D1.h + x.h); D1.en = clamp(D1.en + x.en); D1.m = clamp(D1.m + x.m);
  ["h","en","m"].forEach(k => { $("#b-" + k).style.width = D1[k] + "%"; $("#t-" + k).textContent = D1[k]; });
  if(harm){ bad(); setAv(1, "tired", x.t, "yawn", "💫"); }
  else { good(); add(5); const m = D1.h >= 85 ? "strong" : "happy"; setAv(1, h.a === "sleep" ? "sleep" : m, x.t, x.a, x.fx); }
}

const placed = {}; let T = 6, snacks = 0;

// Soatni chizish: vaqtga qarab osmon, quyosh va oy
function drawClock(t){
  const H = Math.floor(t), M = Math.floor((t % 1) * 60);
  $("#dt").textContent = String(H).padStart(2,"0") + ":" + String(M).padStart(2,"0");
  const rot = (id, deg) => $(id).setAttribute("transform", `rotate(${deg} 150 82)`);
  rot("#hh", (t % 12) / 12 * 360); rot("#mh", (t % 1) * 360);
  $("#skyr").setAttribute("fill", t < 8 ? "#fdba74" : t < 17 ? "#7dd3fc" : t < 19.5 ? "#fb923c" : "#1e1b4b");
  const f = (t - 6) / 13, g = Math.max(0, (t - 18.5) / 3.5);
  $("#sun").setAttribute("cx", 20 + 260 * Math.min(1, f)); $("#sun").setAttribute("cy", 115 - 90 * Math.sin(Math.PI * Math.min(1, f)));
  $("#sun").style.opacity = t < 19.5 ? 1 : 0;
  $("#moon").setAttribute("cx", 40 + 220 * g); $("#moon").setAttribute("cy", 60 - 30 * Math.sin(Math.PI * g)); $("#moon").style.opacity = t >= 18.5 ? 1 : 0;
}
function startDay(){
  stopSims(); T = 6; const chk = {}; let missed = 0; snacks = 0;
  setAv(2, "happy", "Kun boshlandi! ☀️");
  clk = setInterval(() => {
    T += .1; drawClock(Math.min(T, 22));
    MEALS.forEach(m => {
      if(T >= m.t + .4 && !chk[m.id]){
        chk[m.id] = 1;
        if(!placed[m.id]){ missed++; bad(); const r = MISS[m.id]; setAv(2, r[0], r[1], "yawn", m.id === "n" ? "😵‍💫" : "⚠️"); }
        else { good(); setAv(2, "happy", `${m.n} vaqtida yeyildi. Ajoyib!`, "jump", m.e); }
      }
    });
    if(T >= 22){ stopSims(); $("#pie").innerHTML = pie();
      if(!missed){ setAv(2, "strong", "Kun a'lo o'tdi! Kuchim to'la 💪", "jump", "🏆"); add(20, 1); confetti(); }
      else setAv(2, "tired", `${missed} ta ovqat o'tkazib yuborildi. Ertaga tartibga rioya qilaman!`, "yawn"); }
  }, 250);
}
// Ovqat ulushi doiraviy diagrammasi
function pie(){
  let a = 0; const seg = [], leg = [];
  MEALS.filter(m => placed[m.id]).forEach(m => { seg.push(`${m.c} ${a}% ${a + m.s}%`); a += m.s; leg.push(`<span style="color:${m.c}">■</span> ${m.n} ${m.s}%`); });
  seg.push(`#e5e7eb ${a}% 100%`);
  return `<div class="card"><h3>📊 Kunlik ovqat ulushi</h3><div class="pie" style="background:conic-gradient(${seg.join(",")})"></div>${leg.join("<br>")}</div>`;
}
// Hazm qilish animatsiyasi
function startDig(){
  const path = $("#tract"), L = path.getTotalLength(); cancelAnimationFrame(dig);
  const step = () => {
    if($("#v-s2").classList.contains("on") && !digPause){
      digP += $("#spd").value * .0004; if(digP > 1) digP = 0;
      const p = path.getPointAtLength(digP * L); $("#food").setAttribute("cx", p.x); $("#food").setAttribute("cy", p.y);
      const st = [...STAGES].reverse().find(s => digP >= s.p); $("#stg").textContent = st.t;
    }
    dig = requestAnimationFrame(step);
  };
  step();
}
// Mini-o'yin: to'g'ri ketma-ketlik
function startOrder(){
  clearInterval(gm); let next = 0, left = 60; $("#gt").textContent = "⏱ 60"; $("#gc").innerHTML = "";
  shuffle(MEALS).forEach(m => {
    const d = document.createElement("div"); d.className = "dc"; d.innerHTML = `<div style="font-size:32px">${m.e}</div>${m.n}`;
    d.onclick = () => {
      if(!gm) return;
      if(MEALS[next].id === m.id){ next++; d.style.background = "#bbf7d0"; d.innerHTML += ` ✅${next}`; d.onclick = null; good();
        if(next === 5){ clearInterval(gm); gm = null; add(20 + left, 1); confetti(); $("#gt").textContent = "🎉 Ajoyib! Qolgan vaqt uchun bonus oldingiz."; } }
      else { bad(); d.classList.add("wrong"); setTimeout(() => d.classList.remove("wrong"), 500); }
    };
    $("#gc").append(d);
  });
  gm = setInterval(() => { left--; $("#gt").textContent = "⏱ " + left; if(left <= 0){ clearInterval(gm); gm = null; $("#gt").textContent = "⌛ Vaqt tugadi. Yana urinib ko'r!"; } }, 1000);
}

/* ===================== 3-BO'LIM ===================== */
const plate = {}; // mahsulot indeksi -> gramm
let hpDone = false;
function buildS3(){
  $("#v-s3").innerHTML = `<h1>🍎 Kaloriyaga e'tibor</h1>${avHTML(3)}${theory("s3")}
  <h2>🧮 Kaloriya hisoblagich</h2>
  <div class="card">Mahsulotni bos yoki likopchaga sudra. Grammni slayder bilan o'zgartir (50–300 g).</div>
  <div class="grid" id="fd"></div>
  <h3>🍽 Mening likopcham</h3>
  <div class="zone" id="plate">Bu yerga tashla</div>
  <div class="card" style="margin-top:8px"><b id="kc">0</b> / ${TARGET} kkal <span id="zn"></span><div class="bar"><i id="kb" style="width:0"></i></div>
    <div class="pie" id="mp" style="background:#e5e7eb"></div><div id="ml" style="text-align:center"></div></div>
  <div id="vt"></div>
  <label style="display:block;margin:8px 0"><input type="checkbox" id="hp" style="width:28px;height:28px;vertical-align:middle"> 🥗 Sog'lom likopcha rejimi</label>
  <div id="hpb"></div>
  <button class="btn big alt" id="cmp">⚖️ Taqqosla: sog'lom va nosog'lom kun</button>`;
  FOODS.forEach((f, i) => {
    const d = document.createElement("div"); d.className = "dc"; d.dataset.i = i;
    d.innerHTML = `<div style="font-size:34px">${f.e}</div>${f.n}<div style="font-size:13px;font-weight:400">${f.k} kkal · O${f.p} Y${f.f} U${f.c}</div>`;
    d.onclick = () => { if(!d._d) addFood(i); }; drag(d, "#plate", () => addFood(i)); $("#fd").append(d);
  });
  $("#hp").onchange = calc; $("#cmp").onclick = compare; calc();
}
function addFood(i){ if(!plate[i]) plate[i] = 100; good(); calc(); }
function calc(){
  let k = 0, p = 0, f = 0, c = 0; const grp = {v:0, g:0, p:0, o:0};
  $("#plate").innerHTML = "";
  const keys = Object.keys(plate);
  if(!keys.length) $("#plate").textContent = "Bu yerga tashla";
  keys.forEach(i => {
    const x = FOODS[i], g = plate[i]; k += x.k * g / 100; p += x.p * g / 100; f += x.f * g / 100; c += x.c * g / 100; grp[x.t] += g;
    const r = document.createElement("div"); r.className = "item";
    r.innerHTML = `<span style="font-size:28px">${x.e}</span><input type="range" min="50" max="300" step="10" value="${g}"><b style="min-width:52px">${g} g</b><button class="ib" style="background:#fecaca">✖</button>`;
    r.querySelector("input").oninput = e => { plate[i] = +e.target.value; calc(); };
    r.querySelector("button").onclick = () => { delete plate[i]; calc(); };
    $("#plate").append(r);
  });
  k = Math.round(k); $("#kc").textContent = k; $("#kb").style.width = Math.min(100, k / TARGET * 100) + "%";
  // Zona va avatar
  let z, m, t, an;
  if(!keys.length){ z = ""; m = "happy"; t = "Mahsulot tanla, kaloriyani hisoblaymiz!"; }
  else if(k < 1600){ z = "🔻 Kam"; m = "tired"; t = "Kaloriya kam — holsizlanyapman."; an = "yawn"; }
  else if(k >= 2000 && k <= 2600){ z = "✅ Me'yorda"; m = "strong"; t = "Zo'r! Kaloriya me'yorida, kuchim to'la!"; an = "jump"; }
  else if(k > 2800){ z = "🔺 Ko'p"; m = "heavy"; t = "Juda ko'p kaloriya, qorin og'ir..."; an = "shake"; }
  else { z = "〰️ Deyarli"; m = "happy"; t = "Me'yorga yaqin (2000–2600 kkal)."; }
  $("#zn").textContent = z; setAv(3, m, t, an);
  // Oqsil/yog'/uglevod ulushi
  const tot = p + f + c || 1, pp = Math.round(p / tot * 100), fp = Math.round(f / tot * 100), cp = 100 - pp - fp;
  $("#mp").style.background = keys.length ? `conic-gradient(#ef4444 0 ${pp}%,#facc15 ${pp}% ${pp + fp}%,#3b82f6 ${pp + fp}% 100%)` : "#e5e7eb";
  $("#ml").innerHTML = keys.length ? `<span style="color:#ef4444">■</span> Oqsil ${pp}% <span style="color:#ca8a04">■</span> Yog' ${fp}% <span style="color:#3b82f6">■</span> Uglevod ${keys.length ? cp : 0}%` : "";
  // Vitamin ko'rsatkichi
  $("#vt").innerHTML = keys.length ? (grp.v ? `<div class="okmsg">🍊 Vitamin ko'rsatkichi: yaxshi (meva/sabzavot bor)</div>` : `<div class="warn">⚠️ Meva yoki sabzavot yo'q — vitamin yetishmaydi!</div>`) : "";
  // Sog'lom likopcha rejimi: yarmi meva/sabzavot, choragi don, choragi oqsil
  const all = grp.v + grp.g + grp.p + grp.o;
  if($("#hp").checked){
    const pc = x => all ? Math.round(x / all * 100) : 0, V = pc(grp.v), G = pc(grp.g), P = pc(grp.p);
    const ok = all >= 300 && V >= 40 && V <= 60 && G >= 15 && G <= 35 && P >= 15 && P <= 35 && !grp.o;
    $("#hpb").innerHTML = `<div class="card"><div class="pie" style="background:conic-gradient(#4ade80 0 50%,#fbbf24 50% 75%,#f87171 75% 100%)"></div>
      Ko'rsatma: 🥦 50% sabzavot/meva, 🍚 25% don, 🍗 25% oqsil.<br>Seniki: 🥦 ${V}% · 🍚 ${G}% · 🍗 ${P}%</div>` + (ok ? `<div class="okmsg">🌟 Sog'lom likopcha! Yulduzcha olding!</div>` : "");
    if(ok && !hpDone){ hpDone = true; add(30, 1); confetti(); good(); }
  } else $("#hpb").innerHTML = "";
}
// Ikki xil kun menyusini taqqoslash
function compare(){
  const sum = list => { let k = 0, p = 0, f = 0, c = 0; list.forEach(([i, g]) => { const x = FOODS[i]; k += x.k * g / 100; p += x.p * g / 100; f += x.f * g / 100; c += x.c * g / 100; }); return {k:Math.round(k), p:Math.round(p), f:Math.round(f), c:Math.round(c)}; };
  const col = (title, list, cl) => { const s = sum(list); return `<div style="flex:1;min-width:140px;background:${cl};border-radius:14px;padding:10px"><h3>${title}</h3>${list.map(([i, g]) => `${FOODS[i].e} ${FOODS[i].n} ${g} g`).join("<br>")}<p><b>${s.k} kkal</b><br>Oqsil ${s.p} g<br>Yog' ${s.f} g<br>Uglevod ${s.c} g</p></div>`; };
  modal(`<h2>⚖️ Taqqoslash</h2><div class="row">${col("😄 Sog'lom kun", MENU_GOOD, "#dcfce7")}${col("🤢 Nosog'lom kun", MENU_BAD, "#fee2e2")}</div><p>Nosog'lom menyuda shirinlik, chips va gazli ichimlik ko'p, sabzavot va oqsil kam. Kaloriya ko'p, foyda oz.</p>`);
}

/* ===================== YAKUNIY TEST ===================== */
let qi = 0, right = 0; const wrongBy = {1:0, 2:0, 3:0}; let order = [];
function buildTest(){ qi = 0; right = 0; order = shuffle(QUESTIONS); [1,2,3].forEach(k => wrongBy[k] = 0); $("#v-t").innerHTML = `<h1>📝 Yakuniy test</h1>${avHTML("T")}<div id="tq"></div>`; setAv("T", "happy", "Omad! 10 ta savol."); question(); }
function question(){
  if(qi >= order.length) return result();
  const q = order[qi];
  $("#tq").innerHTML = `<div class="card"><b>Savol ${qi + 1}/10</b><br>${q.q}</div><div class="grid" style="grid-template-columns:1fr" id="op"></div><div id="ex"></div>`;
  q.o.forEach((o, i) => { const b = document.createElement("button"); b.className = "btn alt"; b.textContent = o; b.onclick = () => answer(i, b); $("#op").append(b); });
}
function answer(i, b){
  const q = order[qi]; $$("#op button").forEach((x, j) => { x.disabled = true; if(j === q.a) x.style.background = "#bbf7d0"; });
  if(i === q.a){ right++; add(10); good(); $("#ex").innerHTML = `<div class="okmsg">✅ To'g'ri! ${q.e}</div>`; setAv("T", "strong", "Barakalla!", "jump", "⭐"); }
  else { wrongBy[q.s]++; bad(); b.style.background = "#fecaca"; $("#ex").innerHTML = `<div class="warn">❌ To'g'ri javob: ${q.o[q.a]}. ${q.e}</div>`; setAv("T", "sad", "Xato qilsang ham, o'rganasan!", "shake"); }
  $("#ex").innerHTML += `<button class="btn big" onclick="qi++;question()">Keyingisi ➡️</button>`;
}
